<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShopLink - Shops</title>
<meta name="description" content="Browse shops and order straight on WhatsApp.">
<meta name="theme-color" content="#1E2347">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Hanken+Grotesk:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1E2347;--ink-soft:#4A5078;--paper:#F6F7FB;--card:#fff;--marigold:#F5B82E;--marigold-soft:#FDF1D3;--chili:#D93A2B;--wa:#1C9C57;--line:#D9DCEA;--display:"Bricolage Grotesque",system-ui,sans-serif;--body:"Hanken Grotesk",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:1rem;line-height:1.5;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--marigold);outline-offset:2px}
.wrap{width:min(100% - 2.5rem,34rem);margin-inline:auto;padding-bottom:4rem}
.muted{color:var(--ink-soft);margin:0;font-size:.9rem}
h1,h2,h3{font-family:var(--display);letter-spacing:-.01em;margin:0}
.lead{color:var(--ink-soft);margin:1.2rem 0 1rem}
.empty{color:var(--ink-soft);text-align:center;padding:2.5rem 0}

.bar{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:2px solid var(--line);padding:.8rem 0}
.bar .wrap{padding-bottom:0;display:flex;align-items:center;gap:.6rem}
.bar img{width:2rem;height:2rem}
.brand{font-family:var(--display);font-weight:800;font-size:1.25rem;text-decoration:none}
.sell{margin-left:auto;font-weight:700;font-size:.88rem;border:2px solid var(--ink);border-radius:99px;padding:.4rem .9rem;text-decoration:none;min-height:2.5rem;display:inline-flex;align-items:center}

.chips{display:flex;gap:.5rem;overflow-x:auto;margin:0 -1.25rem 1.25rem;padding:.2rem 1.25rem;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:2px solid var(--line);background:#fff;border-radius:99px;padding:.5rem .95rem;font-weight:700;font-size:.92rem;min-height:2.5rem}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}

.shop{margin-bottom:1.75rem}
.shop-head{display:flex;align-items:center;justify-content:space-between;gap:.8rem;flex-wrap:wrap;margin-bottom:.7rem}
.who{display:flex;gap:.8rem;align-items:center;min-width:0;flex:1 1 13rem}
.shop-head h2{font-size:1.3rem;overflow-wrap:anywhere}
.owner{display:flex;align-items:center;gap:.4rem;font-size:.85rem;color:var(--ink-soft);margin-top:.2rem}
.hbtns{display:flex;gap:.45rem;flex:none}
.pillbtn{display:inline-flex;align-items:center;border:2px solid var(--ink);background:#fff;color:var(--ink);font-weight:800;border-radius:99px;padding:.4rem .85rem;font-size:.88rem;min-height:2.5rem;text-decoration:none}
.pillbtn.wa{border-color:var(--wa);color:var(--wa)}
.row{display:flex;gap:.85rem;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -1.25rem;padding:.2rem 1.25rem 1rem;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}

.card.h{flex:0 0 11.5rem;scroll-snap-align:start;padding:.65rem;background:var(--card);border:2px solid var(--line);border-radius:1rem;cursor:pointer}
.card.h h3{font-size:1.05rem;margin:.55rem 0 .1rem}
.tile-wrap{position:relative;border-radius:.7rem;overflow:hidden;background:#E7E9F3}
.card.h .tile-wrap{aspect-ratio:1}
.tile-wrap img{width:100%;height:100%;object-fit:cover;display:block}
.count{position:absolute;right:.5rem;bottom:.5rem;background:rgba(30,35,71,.85);color:#fff;font-size:.78rem;font-weight:700;padding:.1rem .5rem;border-radius:99px;pointer-events:none}
.stamp{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-12deg);border:3px solid var(--chili);color:var(--chili);background:rgba(255,255,255,.92);font-family:var(--display);font-weight:800;font-size:1.2rem;padding:.1rem .7rem;border-radius:.4rem;pointer-events:none}
.price{margin:0;font-weight:800}
.note{display:inline-block;margin:.45rem 0 .6rem;background:var(--marigold-soft);padding:.2rem .6rem;border-radius:.5rem;font-size:.82rem;font-weight:600}
.btn{display:block;width:100%;text-align:center;text-decoration:none;border:2px solid var(--wa);background:var(--wa);color:#fff;font-weight:800;border-radius:.8rem;min-height:2.6rem;padding:.55rem .8rem;font-size:.92rem}
.btn.off{background:#E7E9F3;border-color:#E7E9F3;color:var(--ink-soft);pointer-events:none}
.btn.lg{min-height:3rem;font-size:1rem}
.gap{height:.6rem}

.logo,.photo{flex:none;display:grid;place-items:center;overflow:hidden;font-family:var(--display);font-weight:800}
img.logo,img.photo{display:block;object-fit:cover}
.logo{border-radius:.8rem;background:var(--ink);color:var(--paper)}
.logo.xs{width:1.6rem;height:1.6rem;border-radius:.4rem;font-size:.8rem}
.logo.md{width:3.25rem;height:3.25rem;font-size:1.4rem}
.logo.lg{width:4.5rem;height:4.5rem;font-size:1.8rem;border-radius:1rem}
.photo{border-radius:50%;background:#E7E9F3;color:var(--ink)}
img.photo{object-position:center 25%}
.photo.xs{width:1.5rem;height:1.5rem;font-size:.7rem}
.photo.sm{width:3.5rem;height:3.5rem;font-size:1.3rem}
.photo.md{width:4.5rem;height:4.5rem;font-size:1.7rem}
.photo.lg{width:4.5rem;height:4.5rem;font-size:1.6rem}
.photo.hero{width:6.75rem;height:6.75rem;font-size:2.6rem}
.photo.xl{width:min(70vw,14rem);height:min(70vw,14rem);font-size:5rem}
.avatar{position:relative;flex:none;border:0;background:none;padding:0;border-radius:50%;cursor:pointer}
.logo.badge{position:absolute;right:-.45rem;bottom:-.3rem;width:2.8rem;height:2.8rem;border:3px solid var(--paper);border-radius:.8rem;font-size:1.1rem}
.hero-id{display:grid;justify-items:center;text-align:center;gap:.25rem;margin-bottom:1.1rem}
.hero-id h3{font-size:1.4rem;margin-top:.4rem}
.seller-strip{display:flex;align-items:center;gap:.7rem;min-width:0}
.seller-strip b{display:block;overflow-wrap:anywhere}

.scrim{position:fixed;inset:0;background:rgba(30,35,71,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:min(100%,34rem);max-height:90vh;overflow-y:auto;border-radius:1.25rem 1.25rem 0 0;padding:1.25rem 1.25rem 1.75rem}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}
.sheet-head h2{font-size:1.35rem}
.x{border:0;background:#E7E9F3;border-radius:50%;width:2.6rem;height:2.6rem;font-size:1.2rem}
.idcard{display:flex;gap:.9rem;align-items:center;margin-bottom:.9rem}
.idcard h3{font-size:1.2rem}
.info{display:grid;grid-template-columns:auto 1fr;gap:.7rem 1rem;margin:1rem 0 1.25rem;padding-top:1rem;border-top:2px solid var(--line)}
.info dt{color:var(--ink-soft);font-weight:600}
.info dd{margin:0;font-weight:700;overflow-wrap:anywhere}
.pics{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:.9rem;margin-bottom:.9rem}
.pics::-webkit-scrollbar{display:none}
.pic{position:relative;flex:0 0 100%;scroll-snap-align:start;aspect-ratio:4/5;background:#E7E9F3}
.pic img,.pic video{width:100%;height:100%;object-fit:cover;display:block}
.sheet h3.t{font-size:1.4rem}
.err{background:#FCE6E3;color:#8E1F14;border-radius:.7rem;padding:.75rem .9rem;font-weight:600;margin:1.2rem 0}
.foot{border-top:2px solid var(--line);padding:1.5rem 1.25rem 2.5rem;text-align:center;color:var(--ink-soft);font-size:.9rem;margin-top:1rem}
.foot p{margin:0}
.foot .owner-name{font-family:var(--display);font-weight:800;font-size:1.3rem;color:var(--ink);margin-top:.1rem}
.foot .role{margin-bottom:.9rem}
.foot .sitelink{margin-bottom:.7rem;font-weight:700;color:var(--ink);overflow-wrap:anywhere}
.foot-btns{display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap}
.foot-btns button,.foot-btns a{border:2px solid var(--ink);background:#fff;color:var(--ink);font:inherit;font-weight:800;border-radius:99px;padding:.45rem .95rem;font-size:.88rem;min-height:2.5rem;text-decoration:none;display:inline-flex;align-items:center;cursor:pointer}
.foot-btns a{border-color:var(--wa);color:var(--wa)}
#owner-photo{display:flex;justify-content:center;margin-bottom:.6rem}
.owner-photo{width:6.5rem;height:6.5rem;border-radius:50%;object-fit:cover;object-position:center 25%;border:3px solid var(--line)}
.splash{position:fixed;inset:0;z-index:100;background:#F6F7FB;color:#1E2347;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem;transition:opacity .4s ease}
.splash img{width:7rem;height:7rem;margin-bottom:1.1rem;animation:splash-pop .6s ease both}
.splash h1{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:2.6rem;letter-spacing:-.02em;margin:0 0 .6rem;animation:splash-up .6s .15s ease both}
.splash p{margin:0;font-family:"Hanken Grotesk",system-ui,sans-serif;font-size:1.05rem;color:#4A5078;max-width:20rem;animation:splash-up .6s .3s ease both}
.splash p.sl2{margin-top:.25rem;font-weight:700;color:#1E2347}
@keyframes splash-pop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
@keyframes splash-up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.splash,.splash *{animation:none!important;transition:none!important}}
.searchwrap{margin-top:1.1rem;padding-bottom:0;position:relative}
.searchrow{display:flex;align-items:center;gap:.5rem;background:#fff;border:2px solid var(--ink);border-radius:99px;padding:0 1rem}
.searchrow input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:1rem;min-height:3.1rem;color:var(--ink);outline:none}
.searchrow:focus-within{box-shadow:0 0 0 3px var(--marigold)}
.sugg{list-style:none;margin:.4rem 0 0;padding:.3rem;background:#fff;border:2px solid var(--line);border-radius:1rem;position:absolute;left:0;right:0;z-index:10;box-shadow:0 8px 24px rgba(30,35,71,.15)}
.sugg .hd{padding:.4rem .8rem;font-size:.8rem;font-weight:700;color:var(--ink-soft)}
.sugg button{width:100%;text-align:left;border:0;background:none;padding:.75rem .8rem;border-radius:.7rem;display:flex;justify-content:space-between;gap:.6rem;font-weight:700;min-height:2.75rem}
.sugg button:hover,.sugg button:focus-visible{background:var(--paper)}
.sugg small{color:var(--ink-soft);font-weight:600}
.found{display:flex;align-items:center;justify-content:space-between;gap:.8rem;margin:1rem 0 .4rem}
.found p{margin:0;font-weight:700}
.linkbtn{border:0;background:none;font:inherit;font-weight:800;text-decoration:underline;padding:.4rem 0;min-height:2.5rem}
.placechips{display:flex;flex-wrap:wrap;gap:.5rem;margin:.8rem 0}
</style>
</head>
<body>
<div id="splash" class="splash" role="status" aria-label="ShopLink">
  <img src="logo.svg" alt="">
  <h1>ShopLink</h1>
  <p>Connecting sellers and buyers worldwide.</p>
  <p class="sl2">One link 🖇️ at a time</p>
</div>
<script>
(function () {
  var s = document.getElementById('splash');
  try {
    if (sessionStorage.getItem('shoplink-splash')) { s.remove(); return; }
    sessionStorage.setItem('shoplink-splash', '1');
  } catch (e) { /* show it anyway */ }
  setTimeout(function () { s.style.opacity = '0'; setTimeout(function () { s.remove(); }, 400); }, 2000);
})();
</script>
<header class="bar">
  <div class="wrap">
    <img src="logo.svg" alt="">
    <a class="brand" href="shops.html">ShopLink</a>
    <a class="sell" href="index.html">Sell on ShopLink</a>
  </div>
</header>
<div class="wrap searchwrap" id="searchbox">
  <div class="searchrow"><span aria-hidden="true">📍</span><input id="q" type="search" autocomplete="off" enterkeyhint="search" placeholder="Search a town, e.g. Apam, Elmina, Konongo" aria-label="Search for shops by town"></div>
  <ul id="sugg" class="sugg" hidden></ul>
</div>
<div id="app"><p class="empty">Loading shops...</p></div>
<footer class="foot">
  <div id="owner-photo"></div>
  <p>ShopLink is owned and managed by</p>
  <p class="owner-name" id="owner-name">Ebenezer Abbew</p>
  <p class="role">Founder and Admin</p>
  <p class="sitelink" id="sitelink"></p>
  <div class="foot-btns"><button type="button" id="copysite">Copy link</button><a id="sharesite" target="_blank" rel="noopener">Share on WhatsApp</a></div>
</footer>
<div id="overlay"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const cfg = window.SHOPLINK_CONFIG || {};
const sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DEFAULT_CUR = cfg.CURRENCY || '';
const CC = cfg.COUNTRY_CODE || '';
const curOf = (s) => (s && s.currency) || DEFAULT_CUR;
const money = (n, cur) => (n == null || n === '') ? '' : (cur ? cur + ' ' : '') + Number(n).toLocaleString('en-US');
const mediaUrl = (p) => sb.storage.from('media').getPublicUrl(p).data.publicUrl;
const initial = (t) => (String(t || '').trim()[0] || '?').toUpperCase();
// numbers saved with a country are already complete; older ones may need the country code added
function waNumber(raw, country) {
  let d = String(raw || '').replace(/\D/g, '');
  if (country) return d;
  if (d.startsWith('00')) d = d.slice(2); else if (d.startsWith('0') && CC) d = CC + d.slice(1);
  return d;
}
const sortMedia = (i) => (i.item_media || []).slice().sort((a, b) => a.created_at < b.created_at ? -1 : a.created_at > b.created_at ? 1 : 0);
const shopUrl = (s) => location.origin + location.pathname.replace(/[^/]*$/, '') + 'shops.html?shop=' + encodeURIComponent(s.shop_slug);
const logoHtml = (s, size) => s.logo_path ? `<img class="logo ${size}" src="${esc(mediaUrl(s.logo_path))}" alt="">` : `<span class="logo ${size}">${esc(initial(s.shop_name))}</span>`;
const photoHtml = (s, size) => s.photo_path ? `<img class="photo ${size}" src="${esc(mediaUrl(s.photo_path))}" alt="">` : `<span class="photo ${size}">${esc(initial(s.owner_name))}</span>`;

const only = new URLSearchParams(location.search).get('shop');
const state = {shops:[], cats:[], items:[], cat:'all', sheet:null, q:'', qRaw:''};

async function ok(promise) {
  const { data, error } = await promise;
  if (error) throw new Error(error.message);
  return data || [];
}


/* ---------- search by town ---------- */
const norm = (t) => String(t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9\s]/g, ' ').replace(/\s+/g, ' ').trim();
function matches(s, q) {
  if (!q) return true;
  const hay = norm([s.location, s.landmark, s.shop_name].join(' '));
  return q.split(' ').every((w) => hay.includes(w));
}
// every town written in sellers' locations, with how many shops are there
function places() {
  const map = new Map();
  state.shops.forEach((s) => {
    const seen = new Set();
    String(s.location || '').split(',').forEach((part) => {
      const name = part.trim(), key = norm(name);
      if (!key || seen.has(key)) return;
      seen.add(key);
      const e = map.get(key) || {name, count: 0};
      e.count++; map.set(key, e);
    });
  });
  return Array.from(map.values()).sort((a, b) => b.count - a.count || a.name.localeCompare(b.name));
}
function drawSugg() {
  const box = $('sugg'), q = norm($('q').value);
  let list = places();
  if (q) list = list.filter((p) => norm(p.name).includes(q));
  list = list.slice(0, 6);
  if (!list.length) { box.hidden = true; return; }
  box.innerHTML = (q ? '' : '<li class="hd">Towns with shops</li>') + list.map((p) =>
    `<li><button type="button" data-act="place" data-v="${esc(p.name)}">${esc(p.name)} <small>${p.count} shop${p.count === 1 ? '' : 's'}</small></button></li>`).join('');
  box.hidden = false;
}
function setQuery(text) {
  $('q').value = text;
  state.qRaw = text; state.q = norm(text);
  $('sugg').hidden = true;
  render();
}

function orderLink(i, s) {
  const msg = `Hi, I'd like to order the ${i.title}${i.price != null ? ' (' + money(i.price, curOf(s)) + ')' : ''} from ${s.shop_name} on ShopLink.\n${shopUrl(s)}`;
  return 'https://wa.me/' + waNumber(s.whatsapp, s.country) + '?text=' + encodeURIComponent(msg);
}

function card(i, s) {
  const media = sortMedia(i), first = media.find((m) => m.kind === 'image') || media[0], sold = i.status === 'sold';
  return `<article class="card h" data-act="item" data-v="${i.id}">
    <div class="tile-wrap">${first ? `<img src="${esc(mediaUrl(first.path))}" alt="${esc(i.title)}" loading="lazy">` : ''}${media.length > 1 ? `<span class="count">+${media.length - 1}</span>` : ''}${sold ? '<span class="stamp">Sold</span>' : ''}</div>
    <h3>${esc(i.title)}</h3>${i.price != null ? `<p class="price">${esc(money(i.price, curOf(s)))}</p>` : ''}
    ${i.note ? `<span class="note">${esc(i.note)}</span>` : '<div class="gap"></div>'}
    ${sold ? '<span class="btn off">Sold out</span>' : `<a class="btn" target="_blank" rel="noopener" href="${esc(orderLink(i, s))}">Order on WhatsApp</a>`}
  </article>`;
}

function render() {
  const byShop = {};
  state.items.forEach((i) => { (byShop[i.seller_id] || (byShop[i.seller_id] = [])).push(i); });
  let shops = state.shops.slice();
  if (only) shops = shops.filter((s) => s.shop_slug === only);
  else shops = shops.filter((s) => matches(s, state.q));
  // newest activity first
  const newest = (s) => (byShop[s.id] && byShop[s.id][0]) ? byShop[s.id][0].created_at : '';
  shops.sort((a, b) => newest(a) < newest(b) ? 1 : -1);

  const chips = [['all', 'All']].concat(state.cats.map((c) => [c.id, c.name])).map(([id, name]) =>
    `<button class="chip" aria-pressed="${state.cat === id}" data-act="cat" data-v="${id}">${esc(name)}</button>`).join('');

  const rows = shops.map((s) => {
    const list = (byShop[s.id] || []).filter((i) => state.cat === 'all' || i.category_id === state.cat);
    if (!list.length && !only) return '';
    return `<section class="shop"><div class="shop-head"><div class="who"><button class="avatar" data-act="info" data-v="${s.id}" aria-label="See who runs ${esc(s.shop_name)}">${photoHtml(s, 'hero')}${logoHtml(s, 'badge')}</button><div><h2>${esc(s.shop_name)}</h2><p class="muted">${esc(s.shop_type)}, ${list.length} item${list.length === 1 ? '' : 's'}</p>${s.location ? `<p class="muted">📍 ${esc(s.location)}</p>` : ''}<span class="owner">${esc(s.owner_name)}</span></div></div>
      <div class="hbtns"><button class="pillbtn" data-act="info" data-v="${s.id}" aria-label="Shop info for ${esc(s.shop_name)}">Info</button><a class="pillbtn wa" target="_blank" rel="noopener" href="https://wa.me/${waNumber(s.whatsapp, s.country)}" aria-label="Chat with ${esc(s.shop_name)} on WhatsApp">Chat</a></div></div>
      ${list.length ? `<div class="row">${list.map((i) => card(i, s)).join('')}</div>` : '<p class="muted">No items in this category yet.</p>'}</section>`;
  }).join('');

  let body;
  if (only && !shops.length) body = '<p class="empty">This shop is not available right now.</p><p style="text-align:center"><a href="shops.html"><b>See all shops</b></a></p>';
  else if (rows) body = rows;
  else if (state.q) body = `<p class="empty">No shops found for “${esc(state.qRaw)}” yet.</p><div class="placechips">${places().slice(0, 6).map((p) => `<button class="chip" data-act="place" data-v="${esc(p.name)}">${esc(p.name)}</button>`).join('')}</div>`;
  else body = '<p class="empty">No items in this category yet.</p>';
  $('app').innerHTML = `<main class="wrap"><p class="lead">${only ? '<a href="shops.html"><b>‹ All shops</b></a>' : 'Swipe sideways through each shop. Tap Order to chat with the seller on WhatsApp.'}</p><div class="chips">${chips}</div>${(!only && state.q && rows) ? `<div class="found"><p>Shops for “${esc(state.qRaw)}”</p><button class="linkbtn" data-act="clearq">Clear</button></div>` : ''}${body}</main>`;
  $('overlay').innerHTML = sheet();
}

function sheet() {
  const sh = state.sheet; if (!sh) return '';
  if (sh.type === 'info') {
    const s = state.shops.find((x) => x.id === sh.id);
    return `<div class="scrim" data-act="close"><div class="sheet" role="dialog" aria-modal="true" aria-label="Shop info"><div class="sheet-head"><h2>Shop info</h2><button class="x" data-act="close" aria-label="Close">×</button></div>
    <div class="hero-id">${photoHtml(s, 'xl')}<h3>${esc(s.owner_name)}</h3><p class="muted">Shop owner</p></div>
    <div class="idcard">${logoHtml(s, 'lg')}<div><h3>${esc(s.shop_name)}</h3><p class="muted">${esc(s.shop_type)}</p></div></div>
    <dl class="info"><dt>WhatsApp</dt><dd>+${esc(waNumber(s.whatsapp, s.country))}</dd>
      ${s.email ? `<dt>Email</dt><dd><a href="mailto:${esc(s.email)}">${esc(s.email)}</a></dd>` : ''}
      ${s.location ? `<dt>Location</dt><dd>${esc(s.location)}</dd>` : ''}
      ${s.landmark ? `<dt>Nearest landmark</dt><dd>${esc(s.landmark)}</dd>` : ''}</dl>
    <a class="btn lg" target="_blank" rel="noopener" href="https://wa.me/${waNumber(s.whatsapp, s.country)}">Chat on WhatsApp</a></div></div>`;
  }
  if (sh.type === 'item') {
    const i = state.items.find((x) => x.id === sh.id), s = state.shops.find((x) => x.id === i.seller_id), media = sortMedia(i), sold = i.status === 'sold';
    const cat = state.cats.find((c) => c.id === i.category_id);
    const pics = media.map((m, k) => `<div class="pic">${m.kind === 'video'
      ? `<video src="${esc(mediaUrl(m.path))}" controls playsinline preload="metadata"></video>`
      : `<img src="${esc(mediaUrl(m.path))}" alt="${esc(i.title)}">`}<span class="count">${k + 1} of ${media.length}</span>${sold ? '<span class="stamp">Sold</span>' : ''}</div>`).join('');
    return `<div class="scrim" data-act="close"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(i.title)}"><div class="sheet-head"><div class="seller-strip">${photoHtml(s, 'sm')}<div><b>${esc(s.shop_name)}</b><span class="muted">${esc(s.owner_name)}</span></div></div><button class="x" data-act="close" aria-label="Close">×</button></div>
    <div class="pics">${pics}</div>
    <h3 class="t">${esc(i.title)}</h3><p class="muted">${esc(cat ? cat.name : '')}</p>
    ${i.price != null ? `<p class="price" style="font-size:1.2rem;margin-top:.3rem">${esc(money(i.price, curOf(s)))}</p>` : ''}${i.note ? `<span class="note">${esc(i.note)}</span>` : ''}
    <div style="margin-top:.9rem">${sold ? '<span class="btn off lg">Sold out</span>' : `<a class="btn lg" target="_blank" rel="noopener" href="${esc(orderLink(i, s))}">Order on WhatsApp</a>`}</div></div></div>`;
  }
  return '';
}

document.addEventListener('click', (e) => {
  if (e.target.closest('a[href]')) return;
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (el.classList.contains('scrim') && e.target !== el) return;
  const act = el.dataset.act, v = el.dataset.v;
  if (act === 'cat') { state.cat = v; render(); }
  else if (act === 'place') { setQuery(v); }
  else if (act === 'clearq') { setQuery(''); }
  else if (act === 'info') { state.sheet = {type: 'info', id: v}; render(); }
  else if (act === 'item') { state.sheet = {type: 'item', id: v}; render(); }
  else if (act === 'close') { state.sheet = null; render(); }
});


/* ---------- owner footer: site link to copy and share ---------- */
(function () {
  const url = location.origin + location.pathname.replace(/[^/]*$/, '');
  const text = document.getElementById('sitelink'); if (!text) return;
  text.textContent = url.replace(/^https?:\/\//, '').replace(/\/$/, '');
  document.getElementById('sharesite').href = 'https://wa.me/?text=' + encodeURIComponent('Visit ShopLink: ' + url);
  // owner photo and name come from the admin's profile
  try {
    if (typeof sb !== 'undefined' && sb) {
      sb.from('site_owner').select('full_name,photo_path').limit(1).then(({ data }) => {
        const o = data && data[0]; if (!o) return;
        if (o.full_name) document.getElementById('owner-name').textContent = o.full_name;
        if (o.photo_path) {
          const img = document.createElement('img'); img.className = 'owner-photo'; img.alt = '';
          img.src = sb.storage.from('media').getPublicUrl(o.photo_path).data.publicUrl;
          document.getElementById('owner-photo').appendChild(img);
        }
      });
    }
  } catch (e) { /* the footer still shows the default name */ }
  const btn = document.getElementById('copysite');
  btn.addEventListener('click', () => {
    const done = () => { btn.textContent = 'Copied!'; setTimeout(() => { btn.textContent = 'Copy link'; }, 2000); };
    if (navigator.clipboard) navigator.clipboard.writeText(url).then(done, () => window.prompt('Copy this link:', url));
    else window.prompt('Copy this link:', url);
  });
})();

$('q').addEventListener('input', (e) => { state.qRaw = e.target.value; state.q = norm(e.target.value); drawSugg(); render(); });
$('q').addEventListener('search', (e) => { state.qRaw = e.target.value; state.q = norm(e.target.value); drawSugg(); render(); });
$('q').addEventListener('focus', drawSugg);
$('q').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); $('sugg').hidden = true; $('q').blur(); } });
document.addEventListener('click', (e) => { if (!e.target.closest('#searchbox')) $('sugg').hidden = true; });
if (only) $('searchbox').hidden = true;

(async function boot() {
  try {
    const [shops, cats, items] = await Promise.all([
      ok(sb.from('shops').select('*')),
      ok(sb.from('categories').select('*').order('sort')),
      ok(sb.from('items').select('id,seller_id,title,price,note,status,category_id,created_at,item_media(id,kind,path,created_at)').order('created_at', {ascending: false}))
    ]);
    state.shops = shops; state.cats = cats; state.items = items;
    render();
  } catch (err) {
    $('app').innerHTML = `<main class="wrap"><p class="err">${esc(err.message || err)}</p><button class="btn" onclick="location.reload()">Try again</button></main>`;
  }
})();
</script>
