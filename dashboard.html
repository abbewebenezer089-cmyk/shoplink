<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShopLink dashboard</title>
<meta name="theme-color" content="#1E2347">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Hanken+Grotesk:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1E2347;--ink-soft:#4A5078;--paper:#F6F7FB;--card:#fff;--marigold:#F5B82E;--marigold-soft:#FDF1D3;--chili:#D93A2B;--wa:#1C9C57;--line:#D9DCEA;--display:"Bricolage Grotesque",system-ui,sans-serif;--body:"Hanken Grotesk",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:1rem;line-height:1.5;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--marigold);outline-offset:2px}
.wrap{width:min(100% - 2.5rem,34rem);margin-inline:auto;padding-bottom:4rem}
.muted{color:var(--ink-soft);margin:0;font-size:.9rem}
h2,h3{font-family:var(--display);letter-spacing:-.01em;margin:0}
.lead{color:var(--ink-soft);margin:1.2rem 0 1rem}
.loading{text-align:center;color:var(--ink-soft);padding:3rem 0}

.bar{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:2px solid var(--line);padding:.8rem 0 .7rem}
.bar .wrap{padding-bottom:0}
.brandrow{display:flex;align-items:center;gap:.6rem;margin-bottom:.6rem}
.brandrow img{width:2rem;height:2rem}
.brand{font-family:var(--display);font-weight:800;font-size:1.25rem}
.tag{font-size:.75rem;font-weight:700;background:var(--marigold-soft);padding:.2rem .6rem;border-radius:99px}
.out{margin-left:auto;border:2px solid var(--line);background:#fff;border-radius:99px;font-weight:700;font-size:.88rem;padding:.4rem .9rem;min-height:2.5rem}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:.3rem;background:#E7E9F3;border-radius:.8rem;padding:.25rem}
.seg button{border:0;background:transparent;font-weight:700;color:var(--ink-soft);padding:.6rem .4rem;border-radius:.6rem;min-height:2.75rem}
.seg button[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.badge{display:inline-block;min-width:1.25rem;background:var(--chili);color:#fff;border-radius:99px;font-size:.75rem;padding:0 .35rem;margin-left:.3rem}

.chips{display:flex;gap:.5rem;overflow-x:auto;margin:0 -1.25rem 1rem;padding:.2rem 1.25rem;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:2px solid var(--line);background:#fff;border-radius:99px;padding:.5rem .95rem;font-weight:700;font-size:.92rem;min-height:2.5rem}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}

.acct{background:var(--card);border:2px solid var(--ink);border-radius:1.1rem;padding:1.1rem;margin:1.2rem 0 1rem;box-shadow:6px 6px 0 var(--marigold)}
.acct-top{display:flex;justify-content:space-between;gap:.8rem;align-items:flex-start}
.pill{flex:none;font-size:.8rem;font-weight:800;padding:.2rem .65rem;border-radius:99px}
.pill.ok{background:#E1F3E9;color:#0F5A31}
.pill.wait{background:var(--marigold-soft);color:#7A5200}
.pill.off{background:#FCE6E3;color:#8E1F14}
.notice{background:var(--marigold-soft);border-radius:.8rem;padding:.85rem 1rem;margin:0 0 1rem;font-weight:600}

.sellers{display:grid;gap:.9rem;margin:1rem 0 1.75rem}
.seller{background:#fff;border:2px solid var(--line);border-radius:1rem;padding:1rem}
.seller h3{font-size:1.15rem}
.seller dl{display:grid;grid-template-columns:auto 1fr;gap:.2rem .8rem;margin:.7rem 0 .9rem;font-size:.92rem}
.seller dt{color:var(--ink-soft)}
.seller dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:.55rem}
.btns .full{grid-column:1/-1}
.btn{width:100%;border:2px solid var(--ink);background:var(--marigold);color:var(--ink);font-weight:800;border-radius:.8rem;min-height:2.9rem;padding:.6rem .8rem}
.btn.ghost{background:#fff}
.btn.danger{background:#fff;border-color:var(--chili);color:var(--chili)}
.btn.sm{min-height:2.6rem;font-size:.92rem}
.btn[disabled]{opacity:.6;cursor:wait}
.empty{color:var(--ink-soft);text-align:center;padding:2rem 0}

.convo{display:flex;gap:.8rem;align-items:center;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:1rem;padding:.85rem 1rem;margin-bottom:.7rem}
.convo b{display:block}
.convo span{display:block;color:var(--ink-soft);font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.convo>div{min-width:0;flex:1}
.convo small{color:var(--ink-soft);flex:none}
.back{border:0;background:none;font-weight:800;padding:.6rem 0;min-height:2.75rem;margin-top:.4rem}
.thread{display:flex;flex-direction:column;gap:.55rem;max-height:52vh;overflow-y:auto;padding:.2rem 0 .8rem}
.bubble{max-width:82%;padding:.6rem .85rem;border-radius:1rem;white-space:pre-wrap;overflow-wrap:anywhere}
.bubble small{display:block;opacity:.65;font-size:.72rem;margin-top:.15rem}
.bubble.them{align-self:flex-start;background:#fff;border:2px solid var(--line);border-bottom-left-radius:.3rem}
.bubble.me{align-self:flex-end;background:var(--ink);color:var(--paper);border-bottom-right-radius:.3rem}
.send{display:flex;gap:.5rem;position:sticky;bottom:0;background:var(--paper);padding:.6rem 0}
.send .btn{width:auto;padding-inline:1.1rem}
input{font:inherit;font-size:1rem;padding:.75rem .85rem;min-height:3rem;border:2px solid var(--line);border-radius:.7rem;background:#fff;color:var(--ink);width:100%}
input:focus{border-color:var(--ink);outline:none;box-shadow:0 0 0 3px var(--marigold)}
.addcat{display:flex;gap:.5rem;margin-top:1rem}
.addcat .btn{width:auto;padding-inline:1.1rem}
.catrow{display:flex;justify-content:space-between;align-items:center;gap:.8rem;background:#fff;border:2px solid var(--line);border-radius:.8rem;padding:.5rem .5rem .5rem 1rem;margin-bottom:.5rem;font-weight:700}
.catrow .btn{width:auto;padding-inline:.9rem}

.scrim{position:fixed;inset:0;background:rgba(30,35,71,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:min(100%,34rem);max-height:88vh;overflow-y:auto;border-radius:1.25rem 1.25rem 0 0;padding:1.25rem 1.25rem 1.75rem}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}
.x{border:0;background:#E7E9F3;border-radius:50%;width:2.6rem;height:2.6rem;font-size:1.2rem}
.mini{display:flex;justify-content:space-between;align-items:center;gap:.8rem;padding:.65rem 0;border-bottom:1px solid var(--line)}
.mini b{display:block}
.mini .btn{width:auto;padding-inline:.9rem}
.err{background:#FCE6E3;color:#8E1F14;border-radius:.7rem;padding:.75rem .9rem;font-weight:600;margin:1.2rem 0}
.toast{position:fixed;left:50%;bottom:1.25rem;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.75rem 1.1rem;border-radius:.8rem;z-index:30;max-width:calc(100% - 2rem);font-weight:600;text-align:center}

label{display:grid;gap:.3rem;font-weight:700;font-size:.92rem}
select{font:inherit;font-size:1rem;padding:.75rem .85rem;min-height:3rem;border:2px solid var(--line);border-radius:.7rem;background:#fff;color:var(--ink);width:100%}
select:focus{border-color:var(--ink);outline:none;box-shadow:0 0 0 3px var(--marigold)}
.hint{font-weight:400;color:var(--ink-soft);font-size:.85rem}
.sheet form,.pform{display:grid;gap:.9rem}
.formerr{margin:0;color:#8E1F14;background:#FCE6E3;border-radius:.7rem;padding:.65rem .8rem;font-weight:600;font-size:.92rem}
.formerr:empty{display:none}
.logo,.photo{flex:none;display:grid;place-items:center;overflow:hidden;font-family:var(--display);font-weight:800}
img.logo,img.photo{display:block;object-fit:cover}
.logo{border-radius:.8rem;background:var(--ink);color:var(--paper)}
.logo.sm{width:2.6rem;height:2.6rem;font-size:1.1rem}
.logo.md{width:3.25rem;height:3.25rem;font-size:1.4rem}
.logo.lg{width:4.5rem;height:4.5rem;font-size:1.8rem;border-radius:1rem}
.photo{border-radius:50%;background:#E7E9F3;color:var(--ink)}
img.photo{object-position:center 25%}
.photo.md{width:5.5rem;height:5.5rem;font-size:2rem}
.photo.lg{width:4.5rem;height:4.5rem;font-size:1.6rem}
.photo.hero{width:6.75rem;height:6.75rem;font-size:2.6rem}
.photo.xl{width:9.5rem;height:9.5rem;font-size:3.6rem}
.avatar{position:relative;flex:none}
.logo.badge{position:absolute;right:-.45rem;bottom:-.3rem;width:2.6rem;height:2.6rem;border:3px solid #fff;border-radius:.8rem;font-size:1rem}
.who2{display:flex;gap:.8rem;align-items:center;min-width:0}
.meter{height:.6rem;background:#E7E9F3;border-radius:99px;margin:.9rem 0 .35rem;overflow:hidden}
.meter div{height:100%;background:var(--ink);border-radius:99px}
.share{display:grid;grid-template-columns:1fr 1fr;gap:.55rem;margin-top:.9rem}
a.btn{display:block;text-align:center;text-decoration:none;line-height:1.5}
a.btn.wa,.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.feed{display:grid;gap:1.1rem;margin-top:1rem}
.card.v{background:#fff;border:2px solid var(--line);border-radius:1rem;overflow:hidden}
.tile-wrap{position:relative}
.pics{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.pics::-webkit-scrollbar{display:none}
.pic{position:relative;flex:0 0 100%;scroll-snap-align:start;aspect-ratio:4/5;background:#E7E9F3}
.pic img,.pic video{width:100%;height:100%;object-fit:cover;display:block}
.count{position:absolute;right:.7rem;bottom:.7rem;background:rgba(30,35,71,.85);color:#fff;font-size:.78rem;font-weight:700;padding:.15rem .55rem;border-radius:99px;pointer-events:none}
.stamp{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-12deg);border:3px solid var(--chili);color:var(--chili);background:rgba(255,255,255,.92);font-family:var(--display);font-weight:800;font-size:1.4rem;padding:.1rem .7rem;border-radius:.4rem;pointer-events:none}
.card.v .body{padding:.9rem 1rem 1rem}
.card.v h3{font-size:1.2rem}
.price{margin:0;font-weight:800}
.note{display:inline-block;margin:.45rem 0 .2rem;background:var(--marigold-soft);padding:.2rem .6rem;border-radius:.5rem;font-size:.85rem;font-weight:600}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-top:.7rem}
.actions .full{grid-column:1/-1}
.pickrow{display:flex;gap:.9rem;align-items:center;margin-top:.4rem}
.pickrow input{min-height:0;padding:.55rem}
.fitem{display:flex;align-items:center;gap:.7rem;padding:.4rem 0;border-bottom:1px solid var(--line)}
.fitem img,.vtile{width:3rem;height:3rem;border-radius:.5rem;object-fit:cover;flex:none}
.vtile{display:grid;place-items:center;background:var(--ink);color:#fff;font-size:.75rem;font-weight:700}
.fname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.9rem}
.fitem .x{width:2.2rem;height:2.2rem;font-size:1rem}
.phone{display:flex;gap:.5rem}
.dial{display:grid;place-items:center;min-width:4rem;border:2px solid var(--line);border-radius:.7rem;background:var(--paper);font-weight:700;padding:0 .6rem}
.phone input{flex:1;min-width:0}
.pwbox{font-family:ui-monospace,Menlo,monospace;font-size:1.6rem;font-weight:800;letter-spacing:.08em;background:#fff;border:2px dashed var(--ink);border-radius:.8rem;padding:.9rem;text-align:center;overflow-wrap:anywhere;margin:.8rem 0}
.seg.four button{font-size:.8rem;padding:.6rem .1rem}
.termgrid{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
.quick{display:flex;gap:.5rem}
.plan-note{background:var(--marigold-soft);border-radius:.8rem;padding:.7rem .85rem;margin:.8rem 0;font-size:.92rem}
.foot{border-top:2px solid var(--line);padding:1.5rem 1.25rem 2.5rem;text-align:center;color:var(--ink-soft);font-size:.9rem;margin-top:1rem}
.foot p{margin:0}
.foot .owner-name{font-family:var(--display);font-weight:800;font-size:1.3rem;color:var(--ink);margin-top:.1rem}
.foot .role{margin-bottom:.9rem}
.foot .sitelink{margin-bottom:.7rem;font-weight:700;color:var(--ink);overflow-wrap:anywhere}
.foot-btns{display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap}
.foot-btns button,.foot-btns a{border:2px solid var(--ink);background:#fff;color:var(--ink);font:inherit;font-weight:800;border-radius:99px;padding:.45rem .95rem;font-size:.88rem;min-height:2.5rem;text-decoration:none;display:inline-flex;align-items:center;cursor:pointer}
.foot-btns a{border-color:var(--wa);color:var(--wa)}
#owner-photo{display:flex;justify-content:center;margin-bottom:.6rem}
.owner-photo{width:6.5rem;height:6.5rem;border-radius:50%;object-fit:cover;object-position:center 25%;border:3px solid var(--line)}
.splash{position:fixed;inset:0;z-index:100;background:#F6F7FB;color:#1E2347;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem;transition:opacity .4s ease}
.splash img{width:7rem;height:7rem;margin-bottom:1.1rem;animation:splash-pop .6s ease both}
.splash h1{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:2.6rem;letter-spacing:-.02em;margin:0 0 .6rem;animation:splash-up .6s .15s ease both}
.splash p{margin:0;font-family:"Hanken Grotesk",system-ui,sans-serif;font-size:1.05rem;color:#4A5078;max-width:20rem;animation:splash-up .6s .3s ease both}
.splash p.sl2{margin-top:.25rem;font-weight:700;color:#1E2347}
@keyframes splash-pop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
@keyframes splash-up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.splash,.splash *{animation:none!important;transition:none!important}}
.card.v.hl{border-color:var(--marigold);box-shadow:0 0 0 4px var(--marigold-soft),0 8px 22px rgba(245,184,46,.5)}
.hl-badge{display:inline-block;background:var(--marigold);color:var(--ink);font-weight:800;font-size:.78rem;padding:.15rem .6rem;border-radius:99px;margin-bottom:.4rem}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin:.6rem 0 1rem}
.stat{background:#fff;border:2px solid var(--line);border-radius:.9rem;padding:.7rem .85rem}
.stat span{display:block;color:var(--ink-soft);font-size:.82rem;font-weight:600}
.stat b{font-family:var(--display);font-size:1.15rem;overflow-wrap:anywhere}
.stat.net{grid-column:1/-1;background:var(--ink);color:#fff;border-color:var(--ink)}
.stat.net span{color:#C9CCE6}
.txn{display:flex;align-items:center;gap:.7rem;padding:.7rem 0;border-bottom:1px solid var(--line)}
.txn>div{flex:1;min-width:0}
.txn b{display:block;overflow-wrap:anywhere}
.amt{font-weight:800;flex:none}
.amt.pos{color:#0F5A31}
.amt.neg{color:#8E1F14}
.txn .x{width:2.2rem;height:2.2rem;font-size:1rem}
.mrow{display:grid;grid-template-columns:2.6rem 1fr auto;gap:.6rem;align-items:center;padding:.3rem 0;font-size:.92rem}
.bar{height:.7rem;background:#E7E9F3;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--marigold)}
.salesbtns{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin:1rem 0}
.salesbtns .full{grid-column:1/-1}
.sec3{font-family:var(--display);font-size:1.15rem;margin:1.4rem 0 .5rem}
.line{display:flex;justify-content:space-between;gap:1rem;padding:.4rem 0;border-bottom:1px solid var(--line)}
.line span:first-child{color:var(--ink-soft)}
.bar{position:static}
body{padding-bottom:4.75rem}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:15;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:.25rem;background:#fff;border-top:2px solid var(--line);padding:.4rem .4rem calc(.4rem + env(safe-area-inset-bottom));box-shadow:0 -6px 18px rgba(30,35,71,.08)}
.tabbar button{position:relative;display:grid;justify-items:center;gap:.05rem;border:0;background:transparent;color:var(--ink-soft);font-weight:800;font-size:.76rem;padding:.4rem .1rem;border-radius:.8rem;min-height:3.2rem}
.tabbar button[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.tabbar .ti{font-size:1.15rem;line-height:1.2}
.tabbar .badge{position:absolute;top:.1rem;right:.5rem;margin:0}
.toast{bottom:5.6rem}
.out.backbtn{margin-left:0}
.brandrow{gap:.5rem}
.brandrow img{width:1.8rem;height:1.8rem}
.brand{font-size:1.1rem}
@media (max-width:430px){.tag{display:none}}
.toprow{display:flex;justify-content:space-between;align-items:center;padding-top:.9rem;padding-bottom:0}
.pillbtn{border:2px solid var(--ink);background:#fff;color:var(--ink);font-weight:800;font-size:1rem;border-radius:99px;padding:.5rem 1.2rem;min-height:2.9rem}
.pillbtn.red{border-color:var(--chili);color:var(--chili)}
</style>
</head>
<body>
<div id="splash" class="splash" role="status" aria-label="ShopLink">
  <img src="logo.svg" alt="">
  <h1>ShopLink</h1>
  <p>Connecting sellers and buyers worldwide.</p>
  <p class="sl2">One link 🖇️ at a time</p>
</div>
<script>
(function () {
  var s = document.getElementById('splash');
  try {
    if (sessionStorage.getItem('shoplink-splash')) { s.remove(); return; }
    sessionStorage.setItem('shoplink-splash', '1');
  } catch (e) { /* show it anyway */ }
  setTimeout(function () { s.style.opacity = '0'; setTimeout(function () { s.remove(); }, 400); }, 2000);
})();
</script>
<header class="bar">
  <div class="wrap">
    <div class="brandrow">
      <img src="logo.svg" alt="">
      <span class="brand">ShopLink</span>
      <span class="tag" id="who"></span>
    </div>
  </div>
</header>
<div id="app"><p class="loading">Loading...</p></div>
<footer class="foot">
  <div id="owner-photo"></div>
  <p>ShopLink is owned and managed by</p>
  <p class="owner-name" id="owner-name">Ebenezer Abbew</p>
  <p class="role">Founder and Admin</p>
  <p class="sitelink" id="sitelink"></p>
  <div class="foot-btns"><button type="button" id="copysite">Copy link</button><a id="sharesite" target="_blank" rel="noopener">Share on WhatsApp</a></div>
</footer>
<nav class="tabbar" id="seg" role="tablist" aria-label="Sections"></nav>
<div id="overlay"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="countries.js"></script>
<script>
const cfg = window.SHOPLINK_CONFIG || {};
const sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);

/* ---------- helpers ---------- */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = (iso) => iso ? new Date(iso).toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'}) : 'Not set';
const fmtTime = (iso) => new Date(iso).toLocaleString('en-GB', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'});
const effStatus = (p) => (p.status === 'active' && p.expires_at && new Date(p.expires_at) <= new Date()) ? 'expired' : p.status;
const PILLS = {active:['ok','Active'], pending:['wait','Pending'], expired:['off','Expired'], suspended:['off','Suspended']};
const pill = (p) => { const [c, t] = PILLS[effStatus(p)] || ['wait', p.status]; return `<span class="pill ${c}">${t}</span>`; };
function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 3000);
}

const DEFAULT_CUR = cfg.CURRENCY || '';
const curOf = (p) => (p && p.currency) || DEFAULT_CUR;
const MAXVID = 8 * 1024 * 1024;
const MAXSEC = 65;
const MAXRAW = 250 * 1024 * 1024;
const money = (n, cur) => (n == null || n === '') ? '' : (cur ? cur + ' ' : '') + Number(n).toLocaleString('en-US');
const mediaUrl = (p) => sb.storage.from('media').getPublicUrl(p).data.publicUrl;
const initial = (t) => (String(t || '').trim()[0] || '?').toUpperCase();
function logoHtml(p, size, id) {
  const a = id ? ` id="${id}"` : '';
  return p.logo_path ? `<img${a} class="logo ${size}" src="${esc(mediaUrl(p.logo_path))}" alt="">` : `<span${a} class="logo ${size}">${esc(initial(p.shop_name))}</span>`;
}
function photoHtml(p, size, id) {
  const a = id ? ` id="${id}"` : '';

}

const shopLink = () => location.origin + location.pathname.replace(/[^/]*$/, '') + 'shops.html?shop=' + encodeURIComponent(state.me.shop_slug);

function loadImg(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => resolve({img, url});
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Could not read ' + file.name + '. Please use a JPG or PNG picture.')); };
    img.src = url;
  });
}
async function shrink(file, maxSide, type, quality) {
  const { img, url } = await loadImg(file);
  const r = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
  const w = Math.max(1, Math.round(img.naturalWidth * r)), h = Math.max(1, Math.round(img.naturalHeight * r));
  const canvas = document.createElement('canvas'); canvas.width = w; canvas.height = h;
  canvas.getContext('2d').drawImage(img, 0, 0, w, h);
  URL.revokeObjectURL(url);
  return new Promise((resolve, reject) => canvas.toBlob((b) => b ? resolve(b) : reject(new Error('Could not prepare the picture.')), type, quality));
}

const state = {events:[], sales:[], expenses:[], costs:{}, salesView:'overview', reportYear:null, highlight:new URLSearchParams(location.search).get('item') || (function () { try { return sessionStorage.getItem('shoplink-item'); } catch (e) { return null; } })(), hlDone:false, me:null, role:null, tab:null, filter:'all', sellers:[], counts:{}, categories:[], items:[], messages:[], thread:null, sheet:null, pendingDel:null, refocus:false, files:[], pf:{}, prefill:''};

/* ---------- loading data ---------- */
async function ok(promise) {
  const { data, error } = await promise;
  if (error) throw new Error(error.message);
  return data || [];
}

async function loadMessages() {
  if (state.role === 'admin') {
    state.messages = await ok(sb.from('messages').select('*').order('created_at'));
  } else {
    state.messages = await ok(sb.from('messages').select('*').eq('seller_id', state.me.id).order('created_at'));
  }
}

async function loadAdmin() {
  const [sellers, cats, media, events] = await Promise.all([
    ok(sb.from('profiles').select('*').neq('role', 'admin').order('created_at', {ascending:false})),
    ok(sb.from('categories').select('*').order('sort')),
    ok(sb.from('item_media').select('seller_id,kind')),
    soft(sb.from('events').select('seller_id,kind,visitor,created_at').order('created_at', {ascending: false}).limit(20000)),
    loadMessages()
  ]);
  state.events = events;
  state.sellers = sellers;
  state.categories = cats;
  state.counts = {};
  media.forEach((m) => {
    const c = state.counts[m.seller_id] || (state.counts[m.seller_id] = {image:0, video:0});
    c[m.kind]++;
  });
}

async function loadSeller() {
  const [cats, items, sales, expenses, costs, events] = await Promise.all([
    ok(sb.from('categories').select('*').order('sort')),
    ok(sb.from('items').select('id,title,price,note,status,category_id,created_at,item_media(id,kind,path,created_at)').eq('seller_id', state.me.id).order('created_at', {ascending: false})),
    soft(sb.from('sales').select('*').eq('seller_id', state.me.id).order('sold_at', {ascending: false})),
    soft(sb.from('expenses').select('*').eq('seller_id', state.me.id).order('spent_at', {ascending: false})),
    soft(sb.from('item_costs').select('item_id,cost_price').eq('seller_id', state.me.id)),
    soft(sb.from('events').select('kind,visitor,item_title,created_at').eq('seller_id', state.me.id).order('created_at', {ascending: false}).limit(5000)),
    loadMessages()
  ]);
  state.events = events;
  state.categories = cats;
  state.items = items;
  state.sales = sales;
  state.expenses = expenses;
  state.costs = {};
  costs.forEach((c) => { state.costs[c.item_id] = c.cost_price; });
}
function usage() {
  const u = {image: 0, video: 0};
  state.items.forEach((i) => (i.item_media || []).forEach((m) => { u[m.kind === 'video' ? 'video' : 'image']++; }));
  return u;
}

async function reloadMe() {
  const { data } = await sb.from('profiles').select('*').eq('id', state.me.id).single();
  if (data) state.me = data;
}

/* ---------- sales, expenses and reports ---------- */
const EXP_LABEL = {advertising: 'Advertising', transport: 'Transport', data: 'Data and airtime', packaging: 'Packaging', rent: 'Rent', other: 'Other'};
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const sumOf = (list, key) => list.reduce((n, r) => n + (Number(r[key]) || 0), 0);
const cash = (n) => money(Math.round((Number(n) || 0) * 100) / 100, curOf(state.me));
const soft = (promise) => promise.then(({data, error}) => (error ? [] : (data || [])), () => []);
function todayText() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
const expenseDate = (r) => new Date(r.spent_at + 'T12:00:00');

function calc(inRange) {
  const s = state.sales.filter((r) => inRange(new Date(r.sold_at)));
  const e = state.expenses.filter((r) => inRange(expenseDate(r)));
  const revenue = sumOf(s, 'amount'), cogs = sumOf(s, 'cost'), spent = sumOf(e, 'amount');
  return {count: s.length, revenue, cogs, gross: revenue - cogs, spent, net: revenue - cogs - spent, sales: s, exp: e};
}

async function saveCost(itemId, raw) {
  const v = String(raw == null ? '' : raw).trim();
  if (v === '') { await sb.from('item_costs').delete().eq('item_id', itemId); return; }
  const { error } = await sb.from('item_costs').upsert({item_id: itemId, seller_id: state.me.id, cost_price: Number(v)});
  if (error) throw new Error(error.message);
}

async function sellItem(f) {
  const err = $('sell-err'), id = state.sheet.id;
  const amount = Number(f.get('amount')), costRaw = String(f.get('cost')).trim();
  if (!(amount >= 0) || String(f.get('amount')).trim() === '') { err.textContent = 'Enter the amount you received.'; return; }
  err.textContent = 'Saving...';
  const { data, error } = await sb.rpc('sell_item', {p_item: id, p_amount: amount, p_cost: costRaw === '' ? null : Number(costRaw)});
  if (error) { err.textContent = ''; throw new Error(error.message); }
  const files = data || [];
  for (let i = 0; i < files.length; i += 100) await sb.storage.from('media').remove(files.slice(i, i + 100));
  state.sheet = null; await loadSeller(); render();
  toast('Sale recorded. The item and its pictures were removed.');
}

async function addExpense(f) {
  const err = $('exp-err'), amount = Number(f.get('amount'));
  if (!(amount >= 0) || String(f.get('amount')).trim() === '') { err.textContent = 'Enter the amount.'; return; }
  const { error } = await sb.from('expenses').insert({seller_id: state.me.id, kind: f.get('kind'), description: String(f.get('description')).trim() || null, amount, spent_at: f.get('date') || todayText()});
  if (error) throw new Error(error.message);
  state.sheet = null; await loadSeller(); render(); toast('Expense saved.');
}

async function addSale(f) {
  const err = $('sale-err'), amount = Number(f.get('amount')), title = String(f.get('title')).trim(), costRaw = String(f.get('cost')).trim();
  if (!title) { err.textContent = 'Enter what was sold.'; return; }
  if (!(amount >= 0) || String(f.get('amount')).trim() === '') { err.textContent = 'Enter the amount received.'; return; }
  const when = new Date((f.get('date') || todayText()) + 'T12:00:00').toISOString();
  const { error } = await sb.from('sales').insert({seller_id: state.me.id, item_title: title, amount, cost: costRaw === '' ? null : Number(costRaw), sold_at: when});
  if (error) throw new Error(error.message);
  state.sheet = null; await loadSeller(); render(); toast('Sale saved.');
}

async function deleteEntry(kind, id) {
  const { error } = await sb.from(kind === 'sale' ? 'sales' : 'expenses').delete().eq('id', id);
  state.pendingDel = null;
  if (error) throw new Error(error.message);
  await loadSeller(); render(); toast('Entry deleted.');
}

function reachOf(list, inRange) {
  const e = list.filter((r) => inRange(new Date(r.created_at)));
  const by = (k) => e.filter((r) => r.kind === k);
  const visitors = new Set(e.map((r) => r.visitor).filter(Boolean));
  const asked = {};
  by('enquiry').forEach((r) => { if (r.item_title) asked[r.item_title] = (asked[r.item_title] || 0) + 1; });
  const top = Object.keys(asked).sort((a, b) => asked[b] - asked[a]).slice(0, 3).map((t) => ({title: t, n: asked[t]}));
  return {visits: by('shop_visit').length, views: by('item_view').length, enquiries: by('enquiry').length, visitors: visitors.size, top};
}

    <div class="salesbtns"><button class="btn" data-act="openSale">Record a sale</button><button class="btn" data-act="openExpense">Add expense</button>

function renderReport() {
  const cy = new Date().getFullYear();
  const years = Array.from(new Set(state.sales.map((r) => new Date(r.sold_at).getFullYear()).concat(state.expenses.map((r) => expenseDate(r).getFullYear()), [cy]))).sort((a, b) => b - a);
  const y = years.indexOf(state.reportYear) >= 0 ? state.reportYear : years[0];
  const r = calc((d) => d.getFullYear() === y);
  const months = MONTHS.map((_, m) => calc((d) => d.getFullYear() === y && d.getMonth() === m));
  const maxRev = Math.max(1, ...months.map((m) => m.revenue));
  const monthRows = months.map((m, i) => `<div class="mrow"><span>${MONTHS[i]}</span><div class="bar"><i style="width:${Math.round(m.revenue / maxRev * 100)}%"></i></div><b>${esc(cash(m.net))}</b></div>`).join('');
  const byItem = {};
  r.sales.forEach((s) => { const e = byItem[s.item_title] || (byItem[s.item_title] = {title: s.item_title, revenue: 0, count: 0}); e.revenue += Number(s.amount) || 0; e.count++; });
  const top = Object.values(byItem).sort((a, b) => b.revenue - a.revenue).slice(0, 5);
  const byKind = {};
  r.exp.forEach((e) => { byKind[e.kind] = (byKind[e.kind] || 0) + (Number(e.amount) || 0); });
  const kinds = Object.keys(byKind).sort((a, b) => byKind[b] - byKind[a]);
  const margin = r.revenue ? (r.net / r.revenue * 100) : 0;
  const ads = byKind.advertising || 0;
  const adShare = r.revenue ? (ads / r.revenue * 100) : 0;
  let best = -1; months.forEach((m, i) => { if (m.revenue > 0 && (best < 0 || m.net > months[best].net)) best = i; });
  const line = (a, b) => `<div class="line"><span>${a}</span><b>${b}</b></div>`;
  const rc = reachOf(state.events, (d) => d.getFullYear() === y);
  const summary = 'ShopLink report ' + y + ' for ' + state.me.shop_name + '. Sales: ' + cash(r.revenue) + '. Net profit: ' + cash(r.net) + '. Number of sales: ' + r.count + '.';
  const chips = years.map((yy) => `<button class="chip" aria-pressed="${yy === y}" data-act="year" data-v="${yy}">${yy}</button>`).join('');
  return `<main class="wrap"><button class="back" data-act="salesView" data-v="overview">‹ Back to Sales</button>
    <h2>Yearly report</h2><div class="chips" style="margin-top:.8rem">${chips}</div>
    ${line('Sales (revenue)', esc(cash(r.revenue)))}${line('Cost of goods sold', esc(cash(r.cogs)))}${line('Gross profit', esc(cash(r.gross)))}${line('Expenses', esc(cash(r.spent)))}${line('<b>Net profit</b>', '<b>' + esc(cash(r.net)) + '</b>')}
    ${line('Number of sales', r.count)}${line('People who visited your shop', rc.visitors)}${line('Enquiries on WhatsApp', rc.enquiries)}${rc.enquiries ? line('Sales for every 100 enquiries', Math.round(r.count / rc.enquiries * 100)) : ''}${line('Profit margin', margin.toFixed(1) + '%')}${line('Advertising spend', esc(cash(ads)) + (r.revenue ? ' (' + adShare.toFixed(1) + '% of sales)' : ''))}${best >= 0 ? line('Best month', MONTHS[best] + ' (' + esc(cash(months[best].net)) + ' profit)') : ''}
    <h3 class="sec3">Month by month</h3><p class="hint">Bar: sales. Number: net profit.</p>${monthRows}
    <h3 class="sec3">Best-selling items</h3>${top.map((t) => line(esc(t.title) + ' (' + t.count + ')', esc(cash(t.revenue)))).join('') || '<p class="muted">No sales this year yet.</p>'}
    <h3 class="sec3">Where the money went</h3>${kinds.map((k) => line(esc(EXP_LABEL[k] || k), esc(cash(byKind[k])))).join('') || '<p class="muted">No expenses this year yet.</p>'}
    <h3 class="sec3">Download reports</h3>
    <p class="hint">Download your ${y} records as CSV files. You can open them in Excel or Google Sheets.</p>
    <div class="salesbtns">
      <button class="btn full" data-act="downloadReport" data-v="pnl">Download profit &amp; loss</button>
      <button class="btn ghost full" data-act="downloadReport" data-v="monthly">Download monthly summary</button>
      <button class="btn ghost full" data-act="downloadReport" data-v="sales">Download sales details</button>
      <button class="btn ghost full" data-act="downloadReport" data-v="expenses">Download expense details</button>
      <a class="btn wa sm full" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(summary)}">Share summary on WhatsApp</a>
    </div></main>`;
}

function csvCell(value) {
  const s = value == null ? '' : String(value);
  return '"' + s.replace(/"/g, '""') + '"';
}
function downloadCsv(filename, rows) {
  const csv = '\uFEFF' + rows.map((row) => row.map(csvCell).join(',')).join('\r\n');
  const blob = new Blob([csv], {type: 'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function exportReport(kind) {
  const cy = new Date().getFullYear();
  const years = Array.from(new Set(state.sales.map((r) => new Date(r.sold_at).getFullYear()).concat(state.expenses.map((r) => expenseDate(r).getFullYear()), [cy]))).sort((a, b) => b - a);
  const y = years.indexOf(state.reportYear) >= 0 ? state.reportYear : years[0];
  const r = calc((d) => d.getFullYear() === y);
  const base = 'ShopLink-' + y + '-';
  if (kind === 'pnl') {
    downloadCsv(base + 'Profit-and-Loss.csv', [['ShopLink Profit and Loss', y], ['Business', state.me.shop_name], ['Item', 'Amount'], ['Sales revenue', r.revenue], ['Cost of goods sold', r.cogs], ['Gross profit', r.gross], ['Operating expenses', r.spent], ['Net profit', r.net], ['Number of sales', r.count]]);
  } else if (kind === 'monthly') {
    const rows = [['Month', 'Sales revenue', 'Cost of goods sold', 'Gross profit', 'Expenses', 'Net profit', 'Number of sales']];
    MONTHS.forEach((month, i) => { const m = calc((d) => d.getFullYear() === y && d.getMonth() === i); rows.push([month + ' ' + y, m.revenue, m.cogs, m.gross, m.spent, m.net, m.count]); });
    downloadCsv(base + 'Monthly-Summary.csv', rows);
  } else if (kind === 'sales') {
    const rows = [['Date', 'Item sold', 'Sales amount', 'Cost of goods sold', 'Profit']];
    r.sales.forEach((sale) => rows.push([new Date(sale.sold_at).toLocaleDateString(), sale.item_title, Number(sale.amount) || 0, Number(sale.cost) || 0, (Number(sale.amount) || 0) - (Number(sale.cost) || 0)]));
    downloadCsv(base + 'Sales-Details.csv', rows);
  } else if (kind === 'expenses') {
    const rows = [['Date', 'Category', 'Description', 'Amount']];
    r.exp.forEach((expense) => rows.push([expense.spent_at, EXP_LABEL[expense.kind] || expense.kind, expense.description || '', Number(expense.amount) || 0]));
    downloadCsv(base + 'Expense-Details.csv', rows);
  }
}

/* ---------- render ---------- */
function render() {
  const admin = state.role === 'admin';
  const tabs = admin ? [['sellers', 'Sellers'], ['messages', 'Messages'], ['categories', 'Categories'], ['profile', 'Profile']] : [['shop', 'My shop'], ['sales', 'Sales'], ['profile', 'Profile'], ['messages', 'Messages']];
  const pending = admin ? state.sellers.filter((s) => effStatus(s) === 'pending').length : 0;
  $('seg').style.gridTemplateColumns = 'repeat(' + tabs.length + ',1fr)';
  $('seg').classList.toggle('four', tabs.length === 4);
  const ICON = {sellers: '👥', messages: '💬', categories: '🗂️', profile: '👤', shop: '🏪', sales: '📊'};
  $('seg').innerHTML = tabs.map(([k, l]) =>
    `<button role="tab" aria-selected="${state.tab === k}" data-act="tab" data-v="${k}"><span class="ti" aria-hidden="true">${ICON[k] || ''}</span><span>${l}</span>${k === 'sellers' && pending ? `<span class="badge">${pending}</span>` : ''}</button>`).join('');
  let html;
  if (admin) html = state.tab === 'sellers' ? renderSellers() : state.tab === 'messages' ? renderAdminMessages() : state.tab === 'categories' ? renderCategories() : renderAdminProfile();
  else html = state.tab === 'shop' ? renderShop() : state.tab === 'sales' ? renderSales() : state.tab === 'profile' ? renderProfile() : renderSellerMessages();
  $('app').innerHTML = topRow() + html;
  $('overlay').innerHTML = renderSheet();
  const th = $('thread'); if (th) th.scrollTop = th.scrollHeight;
  if (state.highlight && !state.hlDone && state.tab === 'shop') { const hl = document.getElementById('item-' + state.highlight); if (hl) { state.hlDone = true; if (hl.scrollIntoView) hl.scrollIntoView({block: 'center'}); } }
  if (state.refocus) { const i = document.querySelector('.chat-input'); if (i) i.focus(); state.refocus = false; }
  if (state.prefill) { const i = document.querySelector('.chat-input'); if (i) { i.value = state.prefill; i.focus(); } state.prefill = ''; }
}

async function refresh() {
  if (state.role === 'admin') await loadAdmin(); else { await reloadMe(); await loadSeller(); }
  render();
}

/* ---------- actions ---------- */
async function guard(fn) {
  try { await fn(); } catch (err) { toast(err.message || 'Something went wrong. Try again.'); }
}

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (el.classList.contains('scrim') && e.target !== el) return;
  const act = el.dataset.act, v = el.dataset.v;
  if (act === 'tab') { state.tab = v; state.thread = null; state.pendingDel = null; if (state.role !== 'admin' && v === 'shop') guard(refresh); else render(); window.scrollTo(0, 0); }
  else if (act === 'filter') { state.filter = v; render(); }
  else if (act === 'activate') guard(async () => {
    const months = Number(el.dataset.m);
    await ok(sb.rpc('activate_seller', {p_id: v, p_months: months}).then((r) => ({data: [], error: r.error})));
    state.sheet = null; await refresh(); toast('Done. ' + sellerName(v) + ' is updated.');
  });
  else if (act === 'suspend') guard(async () => {
    await ok(sb.from('profiles').update({status: 'suspended'}).eq('id', v).then((r) => ({data: [], error: r.error})));
    await refresh(); toast(sellerName(v) + ' is suspended.');
  });
  else if (act === 'msgSeller' || act === 'openThread') { state.tab = 'messages'; state.thread = v; render(); }
  else if (act === 'back') { state.thread = null; render(); }
  else if (act === 'goback') { dashBack(); }
  else if (act === 'viewItems') guard(async () => {
    const items = await ok(sb.from('items').select('id,title,price,status,categories(name),item_media(id,path)').eq('seller_id', v).order('created_at', {ascending: false}));
    state.sheet = {id: v, items}; state.pendingDel = null; render();
  });
  else if (act === 'closeSheet') { closeSheet(); }
  else if (act === 'resetPw') { state.sheet = {type: 'resetpw', id: v}; render(); }
  else if (act === 'doReset') guard(() => resetPassword(v));
  else if (act === 'copypw') { const pw = state.sheet && state.sheet.password; if (pw && navigator.clipboard) navigator.clipboard.writeText(pw).then(() => toast('Password copied.'), () => window.prompt('Copy the password:', pw)); else if (pw) window.prompt('Copy the password:', pw); }
  else if (act === 'deleteAcct') { state.sheet = {type: 'delacct', id: v}; render(); }
  else if (act === 'logout') { sb.auth.signOut().then(() => { location.href = 'index.html'; }); }
  else if (act === 'chooseTerm') { state.sheet = {type: 'term', id: v}; render(); }
  else if (act === 'limitSheet') { state.sheet = {type: 'limit', id: v}; render(); }
  else if (act === 'addlimit') { const inp = document.querySelector('[name=limit]'); if (inp) inp.value = (Number(inp.value) || 80) + Number(v); }
  else if (act === 'askMore') { state.tab = 'messages'; state.prefill = 'Hello, I would like to increase my picture limit. Please tell me the cost.'; render(); }
  else if (act === 'openAdd') { state.files = []; state.sheet = {type: 'add'}; render(); }
  else if (act === 'openEdit') { state.sheet = {type: 'edit', id: v}; render(); }
  else if (act === 'rmfile') { const x = state.files.splice(Number(v), 1)[0]; if (x) { x.cancelled = true; if (x.url) URL.revokeObjectURL(x.url); } drawFiles(); }
  else if (act === 'copy') {
    const link = shopLink();
    if (navigator.clipboard) navigator.clipboard.writeText(link).then(() => toast('Shop link copied.'), () => window.prompt('Copy your shop link:', link));
    else window.prompt('Copy your shop link:', link);
  }
  else if (act === 'sellSheet') { state.sheet = {type: 'sell', id: v}; render(); }
  else if (act === 'openSale') { state.sheet = {type: 'sale'}; render(); }
  else if (act === 'openExpense') { state.sheet = {type: 'expense'}; render(); }
  else if (act === 'salesView') { state.salesView = v; render(); window.scrollTo(0, 0); }
  else if (act === 'year') { state.reportYear = Number(v); render(); }
  else if (act === 'downloadReport') { exportReport(v); }
  else if (act === 'delTxn') {
    if (state.pendingDel !== v) { state.pendingDel = v; render(); setTimeout(() => { if (state.pendingDel === v) { state.pendingDel = null; render(); } }, 3500); return; }
    guard(() => deleteEntry(el.dataset.kind, v));
  }
  else if (act === 'delMine') {
    if (state.pendingDel !== v) { state.pendingDel = v; render(); setTimeout(() => { if (state.pendingDel === v) { state.pendingDel = null; render(); } }, 3500); return; }
    guard(async () => {
      const it = state.items.find((x) => x.id === v);
      const paths = (it.item_media || []).map((m) => m.path);
      if (paths.length) await sb.storage.from('media').remove(paths);
      const { error } = await sb.from('items').delete().eq('id', v);
      state.pendingDel = null;
      if (error) throw new Error(error.message);
      await loadSeller(); render(); toast('Item deleted. Space freed up.');
    });
  }
  else if (act === 'delItem') {
    if (state.pendingDel !== v) { state.pendingDel = v; render(); setTimeout(() => { if (state.pendingDel === v) { state.pendingDel = null; render(); } }, 3500); return; }
    guard(async () => {
      const item = state.sheet.items.find((i) => i.id === v);
      const paths = item.item_media.map((m) => m.path);
      if (paths.length) await sb.storage.from('media').remove(paths);
      await ok(sb.from('items').delete().eq('id', v).then((r) => ({data: [], error: r.error})));
      state.sheet.items = state.sheet.items.filter((i) => i.id !== v); state.pendingDel = null;
      await loadAdmin(); render(); toast('Item removed.');
    });
  }
  else if (act === 'delCat') {
    if (state.pendingDel !== v) { state.pendingDel = v; render(); setTimeout(() => { if (state.pendingDel === v) { state.pendingDel = null; render(); } }, 3500); return; }
    guard(async () => {
      const { error } = await sb.from('categories').delete().eq('id', v);
      state.pendingDel = null;
      if (error) { render(); throw new Error(error.code === '23503' ? 'That category still has items, so it cannot be deleted.' : error.message); }
      await loadAdmin(); render(); toast('Category deleted.');
    });
  }
});

document.addEventListener('submit', (e) => {
  const form = e.target.closest('[data-form]'); if (!form) return;
  e.preventDefault();
  const f = new FormData(form), kind = form.dataset.form;
  if (kind === 'send') guard(async () => {
    const body = String(f.get('text')).trim(); if (!body) return;
    const admin = state.role === 'admin';
    const row = {seller_id: admin ? state.thread : state.me.id, sender: admin ? 'admin' : 'seller', body};
    const { error } = await sb.from('messages').insert(row);
    if (error) throw new Error(error.message);
    await loadMessages(); state.refocus = true; render();
  });
  else if (kind === 'add') postItem(form, f);
  else if (kind === 'edit') guard(async () => {
    const title = String(f.get('title')).trim(), price = String(f.get('price')).trim();
    const { error } = await sb.from('items').update({title, price: price === '' ? null : Number(price), category_id: f.get('category'), note: String(f.get('note')).trim() || null}).eq('id', state.sheet.id);
    if (error) throw new Error(error.message);
    await saveCost(state.sheet.id, f.get('cost'));
    await loadSeller(); closeSheet(); toast('Changes saved.');
  });
  else if (kind === 'profile') saveProfile(form, f);
  else if (kind === 'sell') guard(() => sellItem(f));
  else if (kind === 'expense') guard(() => addExpense(f));
  else if (kind === 'sale') guard(() => addSale(f));
  else if (kind === 'adminprofile') saveAdminProfile(form, f);
  else if (kind === 'password') guard(() => changePassword(form, f));
  else if (kind === 'delacct') guard(() => deleteAccount(f));
  else if (kind === 'limit') guard(async () => {
    const n = Math.floor(Number(f.get('limit')));
    if (!(n >= 80)) { $('limit-err').textContent = 'The minimum is 80 pictures.'; return; }
    const id = state.sheet.id, name = sellerName(id);
    const { error } = await sb.from('profiles').update({picture_limit: n}).eq('id', id);
    if (error) throw new Error(error.message);
    state.sheet = null; await refresh(); toast(name + ' can now upload ' + n + ' pictures.');
  });
  else if (kind === 'cat') guard(async () => {
    const name = String(f.get('name')).trim(); if (!name) return;
    const { error } = await sb.from('categories').insert({name, sort: 50});
    if (error) throw new Error(error.code === '23505' ? 'That category already exists.' : error.message);
    await loadAdmin(); render(); toast(name + ' added. Sellers can use it now.');
  });
});

/* ---------- passwords and accounts ---------- */
function randomPassword() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789';
  const a = new Uint32Array(10); crypto.getRandomValues(a);
  return Array.from(a, (n) => chars[n % chars.length]).join('');
}
function waDigits(p) {
  let d = String(p.whatsapp || '').replace(/\D/g, '');
  if (!p.country) { if (d.startsWith('00')) d = d.slice(2); else if (d.startsWith('0') && cfg.COUNTRY_CODE) d = cfg.COUNTRY_CODE + d.slice(1); }
  return d;
}
const loginEmail = (p) => p.login_email || p.email || '';

async function resetPassword(id) {
  const password = randomPassword();
  const { error } = await sb.rpc('admin_set_password', {p_id: id, p_password: password});
  if (error) throw new Error(error.message);
  state.sheet = {type: 'pwdone', id, password}; render();
}

async function deleteAccount(f) {
  const err = $('del-err');
  if (String(f.get('confirm')).trim().toUpperCase() !== 'DELETE') { err.textContent = 'Type DELETE to confirm.'; return; }
  const id = state.sheet.id, s = state.sellers.find((x) => x.id === id), name = s.shop_name;
  err.textContent = 'Deleting...';
  const media = await ok(sb.from('item_media').select('path').eq('seller_id', id));
  const paths = media.map((m) => m.path);
  if (s.logo_path) paths.push(s.logo_path);
  if (s.photo_path) paths.push(s.photo_path);
  for (let i = 0; i < paths.length; i += 100) await sb.storage.from('media').remove(paths.slice(i, i + 100));
  const { error } = await sb.rpc('admin_delete_account', {p_id: id});
  if (error) { err.textContent = ''; throw new Error(error.message); }
  state.sheet = null; await refresh(); toast(name + ' was deleted for good.');
}

async function changePassword(form, f) {
  const a = String(f.get('password')), b = String(f.get('again')), msg = $('pw-msg');
  if (a.length < 8) { msg.textContent = 'Use at least 8 characters.'; return; }
  if (a !== b) { msg.textContent = 'The two passwords do not match.'; return; }
  const { error } = await sb.auth.updateUser({password: a});
  if (error) throw new Error(error.message);
  if (form.reset) form.reset();
  msg.textContent = ''; toast('Password changed.');
}

function passwordCard() {
  return `<form class="pform" data-form="password" style="margin-top:1.75rem;padding-top:1.25rem;border-top:2px solid var(--line)">
    <h3>Change password</h3>
    <p class="hint">You sign in with this email: <b>${esc(loginEmail(state.me))}</b>. Write it down so you do not forget it.</p>
    <label>New password<input name="password" type="password" minlength="8" autocomplete="new-password" required></label>
    <label>Repeat the new password<input name="again" type="password" minlength="8" autocomplete="new-password" required></label>
    <p class="formerr" id="pw-msg" role="alert"></p>
    <button class="btn" type="submit">Change password</button>
  </form>`;
}

/* ---------- videos: about 1 minute and under 8 MB ---------- */
let videoQueue = Promise.resolve();

function videoInfo(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), v = document.createElement('video');
    const timer = setTimeout(() => { URL.revokeObjectURL(url); reject(new Error('Could not read "' + file.name + '".')); }, 15000);
    v.preload = 'metadata';
    v.onloadedmetadata = () => { clearTimeout(timer); const r = {duration: v.duration, w: v.videoWidth, h: v.videoHeight}; URL.revokeObjectURL(url); resolve(r); };
    v.onerror = () => { clearTimeout(timer); URL.revokeObjectURL(url); reject(new Error('Could not read "' + file.name + '". Try another video.')); };
    v.src = url;
  });
}

// plays the video quietly and records it again, smaller, so it fits under 8 MB
async function recompress(entry, info) {
  if (typeof MediaRecorder === 'undefined') throw new Error('This phone cannot shrink videos. Please choose a video under 8 MB.');
  const url = URL.createObjectURL(entry.file), v = document.createElement('video');
  v.src = url; v.playsInline = true; v.preload = 'auto';
  await new Promise((res, rej) => { v.onloadeddata = res; v.onerror = () => rej(new Error('Could not read "' + entry.file.name + '".')); });
  const scale = Math.min(1, 640 / Math.max(info.w, info.h));
  const w = Math.max(2, Math.round(info.w * scale / 2) * 2), h = Math.max(2, Math.round(info.h * scale / 2) * 2);
  const canvas = document.createElement('canvas'); canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  const stream = canvas.captureStream(30);
  let ac = null;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    ac = new AC();
    const src = ac.createMediaElementSource(v), dest = ac.createMediaStreamDestination();
    src.connect(dest);
    dest.stream.getAudioTracks().forEach((t) => stream.addTrack(t));
  } catch (e) { ac = null; }
  const mime = ['video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'].find((m) => MediaRecorder.isTypeSupported(m));
  if (!mime) throw new Error('This phone cannot shrink videos. Please choose a video under 8 MB.');
  const audioBps = 64000;
  const videoBps = Math.max(250000, Math.min(1500000, Math.floor((MAXVID * 0.78 * 8) / Math.max(info.duration, 1) - audioBps)));
  const rec = new MediaRecorder(stream, {mimeType: mime, videoBitsPerSecond: videoBps, audioBitsPerSecond: audioBps});
  const chunks = [];
  rec.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
  const stopped = new Promise((res) => { rec.onstop = res; });
  const ended = new Promise((res) => { v.onended = res; });
  rec.start(1000);
  try { await v.play(); }
  catch (e) { v.muted = true; await v.play(); }
  let raf = 0;
  const draw = () => {
    if (entry.cancelled) { v.pause(); return; }
    ctx.drawImage(v, 0, 0, w, h);
    entry.status = 'Shrinking video... ' + Math.round(v.currentTime) + ' of ' + Math.round(info.duration) + ' seconds. Keep this screen on.';
    drawFiles();
    raf = requestAnimationFrame(draw);
  };
  draw();
  await Promise.race([ended, new Promise((res) => { const t = setInterval(() => { if (entry.cancelled) { clearInterval(t); res(); } }, 500); })]);
  cancelAnimationFrame(raf);
  if (rec.state !== 'inactive') rec.stop();
  await stopped;
  stream.getTracks().forEach((t) => t.stop());
  URL.revokeObjectURL(url);
  if (ac) { try { ac.close(); } catch (e) { /* ignore */ } }
  const type = mime.indexOf('video/mp4') === 0 ? 'video/mp4' : 'video/webm';
  return {blob: new Blob(chunks, {type}), ext: type === 'video/mp4' ? 'mp4' : 'webm', type};
}

async function prepareVideo(entry) {
  const file = entry.file;
  const fail = (msg) => {
    const i = state.files.indexOf(entry); if (i >= 0) state.files.splice(i, 1);
    drawFiles(); const err = $('sheet-err'); if (err) err.textContent = msg;
  };
  try {
    entry.status = 'Checking video...'; drawFiles();
    const info = await videoInfo(file);
    if (entry.cancelled) return;
    if (!isFinite(info.duration) || info.duration > MAXSEC) return fail('"' + file.name + '" is longer than 1 minute. Please choose a shorter video.');
    if (file.size <= MAXVID && /^video\/(mp4|webm)/.test(file.type)) {
      entry.out = {blob: file, ext: file.type.indexOf('webm') >= 0 ? 'webm' : 'mp4', type: file.type.split(';')[0]};
      entry.status = ''; drawFiles(); return;
    }
    entry.status = 'Shrinking video...'; drawFiles();
    const out = await recompress(entry, info);
    if (entry.cancelled) return;
    if (out.blob.size > MAXVID) return fail('"' + file.name + '" is still bigger than 8 MB after shrinking. Please choose a shorter video.');
    entry.out = out; entry.status = ''; drawFiles();
  } catch (e) {
    if (!entry.cancelled) fail(e.message || 'Could not prepare "' + file.name + '".');
  }
}

function closeSheet() {
  state.files.forEach((x) => { x.cancelled = true; if (x.url) URL.revokeObjectURL(x.url); });
  state.files = []; state.sheet = null; render();
}

function drawFiles() {
  const box = $('filelist'); if (!box) return;
  box.innerHTML = state.files.map((x, i) => `<div class="fitem">${x.kind === 'image' ? `<img src="${x.url}" alt="">` : '<span class="vtile">Video</span>'}<span class="fname">${esc(x.file.name)}${x.status ? `<br><small>${esc(x.status)}</small>` : ''}</span><button type="button" class="x" data-act="rmfile" data-v="${i}" aria-label="Remove">×</button></div>`).join('');
}

function addFiles(list) {
  const p = state.me, u = usage(), msgs = [];
  let imgs = state.files.filter((x) => x.kind === 'image').length, vids = state.files.length - imgs;
  list.forEach((file) => {
    const kind = file.type.startsWith('image/') ? 'image' : file.type.startsWith('video/') ? 'video' : null;
    if (!kind) { msgs.push(file.name + ' is not a picture or video.'); return; }
    if (kind === 'video' && file.size > MAXRAW) { msgs.push(file.name + ' is too big. Choose a video under 1 minute.'); return; }
    if (kind === 'image' && u.image + imgs >= p.picture_limit) { msgs.push('You have reached your picture limit. Tap Messages to ask the admin for more.'); return; }
    if (kind === 'video' && u.video + vids >= p.video_limit) { msgs.push('You have reached your video limit.'); return; }
    const entry = {file, kind, url: kind === 'image' ? URL.createObjectURL(file) : null};
    state.files.push(entry);
    if (kind === 'video') videoQueue = videoQueue.then(() => prepareVideo(entry));
    if (kind === 'image') imgs++; else vids++;
  });
  drawFiles();
  const err = $('sheet-err'); if (err) err.textContent = msgs.join(' ');
}

document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.hasAttribute && t.hasAttribute('data-files')) { const list = Array.from(t.files); t.value = ''; addFiles(list); }
  else if (t.id === 'pf-country') {
    const c = SL.byName(t.value);
    $('pf-dial').textContent = '+' + (c ? c.dial : '');
    $('pf-hint').textContent = c ? 'Type your number without the country code.' : 'Include your country code in the number.';
    if (c) $('pf-cur').value = c.cur;
  }
  else if (t.dataset && t.dataset.pf && t.files[0]) {
    const kind = t.dataset.pf, file = t.files[0];
    if (!file.type.startsWith('image/')) { toast('Please choose a picture.'); return; }
    state.pf[kind] = file;
    const el = $('pv-' + kind);
    if (el) el.outerHTML = `<img id="pv-${kind}" class="${kind === 'photo' ? 'photo xl' : 'logo lg'}" src="${URL.createObjectURL(file)}" alt="Preview">`;
  }
});

async function postItem(form, f) {
  const err = $('sheet-err'), btn = $('postbtn');
  const title = String(f.get('title')).trim(), price = String(f.get('price')).trim();
  if (!title) { err.textContent = 'Enter the item name.'; return; }
  if (!state.files.some((x) => x.kind === 'image')) { err.textContent = 'Add at least one picture.'; return; }
  if (state.files.some((x) => x.kind === 'video' && !x.out)) { err.textContent = 'Please wait. A video is still being prepared.'; return; }
  const files = state.files.slice(), me = state.me;
  btn.disabled = true; err.textContent = '';
  let item = null; const uploaded = [];
  try {
    const ins = await sb.from('items').insert({seller_id: me.id, category_id: f.get('category'), title, price: price === '' ? null : Number(price), note: String(f.get('note')).trim() || null}).select('id').single();
    if (ins.error) throw new Error(ins.error.message);
    item = ins.data;
    await saveCost(item.id, f.get('cost'));
    for (let n = 0; n < files.length; n++) {
      btn.textContent = 'Uploading ' + (n + 1) + ' of ' + files.length + '...';
      const x = files[n]; let blob = x.file, ext, type;
      if (x.kind === 'image') { blob = await shrink(x.file, 1280, 'image/jpeg', 0.82); ext = 'jpg'; type = 'image/jpeg'; }
      else { blob = x.out.blob; ext = x.out.ext; type = x.out.type; }
      const path = me.id + '/items/' + item.id + '/' + Date.now() + '-' + n + '.' + ext;
      const up = await sb.storage.from('media').upload(path, blob, {contentType: type, upsert: false});
      if (up.error) throw new Error(up.error.message);
      uploaded.push(path);
      const m = await sb.from('item_media').insert({item_id: item.id, seller_id: me.id, kind: x.kind, path});
      if (m.error) throw new Error(m.error.message);
    }
    await loadSeller(); closeSheet(); toast('Item posted.');
  } catch (error) {
    if (uploaded.length) await sb.storage.from('media').remove(uploaded);
    if (item) await sb.from('items').delete().eq('id', item.id);
    err.textContent = error.message || 'Could not post the item. Try again.';
    btn.disabled = false; btn.textContent = 'Post item';
  }
}

async function saveAdminProfile(form, f) {
  const err = $('profile-err'), btn = $('savebtn'), me = state.me;
  btn.disabled = true; err.textContent = '';
  let path = null;
  try {
    const file = state.pf.photo;
    if (file) {
      const blob = await shrink(file, 600, 'image/jpeg', 0.85);
      path = me.id + '/profile/photo-' + Date.now() + '.jpg';
      const up = await sb.storage.from('media').upload(path, blob, {contentType: 'image/jpeg', upsert: false});
      if (up.error) throw new Error(up.error.message);
    }
    const { error } = await sb.rpc('update_my_profile', {p_full_name: String(f.get('full_name')), p_photo_path: path});
    if (error) throw new Error(error.message);
    if (path && me.photo_path) await sb.storage.from('media').remove([me.photo_path]);
    state.pf = {};
    await reloadMe(); render(); toast('Saved. Your photo now shows in the footer.');
  } catch (error) {
    if (path) await sb.storage.from('media').remove([path]);
    err.textContent = error.message || 'Could not save. Try again.';
    btn.disabled = false;
  }
}

async function saveProfile(form, f) {
  const err = $('profile-err'), btn = $('savebtn'), me = state.me;
  const cn = SL.byName(f.get('country')), whatsapp = SL.join(cn ? cn.dial : '', f.get('whatsapp'));
  if (whatsapp.length < 8) { err.textContent = 'Check your WhatsApp number and country.'; return; }
  btn.disabled = true; err.textContent = '';
  const uploaded = {};
  try {
    for (const kind of ['logo', 'photo']) {
      const file = state.pf[kind]; if (!file) continue;
      const png = kind === 'logo' && file.type === 'image/png';
      const blob = await shrink(file, kind === 'logo' ? 512 : 600, png ? 'image/png' : 'image/jpeg', 0.85);
      const path = me.id + '/profile/' + kind + '-' + Date.now() + '.' + (png ? 'png' : 'jpg');
      const up = await sb.storage.from('media').upload(path, blob, {contentType: png ? 'image/png' : 'image/jpeg', upsert: false});
      if (up.error) throw new Error(up.error.message);
      uploaded[kind] = path;
    }
    const { error } = await sb.rpc('update_my_profile', {
      p_full_name: String(f.get('full_name')), p_shop_name: String(f.get('shop_name')), p_shop_type: String(f.get('shop_type')),
      p_whatsapp: whatsapp, p_email: String(f.get('email')), p_location: String(f.get('location')), p_landmark: String(f.get('landmark')),
      p_logo_path: uploaded.logo || null, p_photo_path: uploaded.photo || null,
      p_country: String(f.get('country')), p_currency: String(f.get('currency')).trim()
    });
    if (error) throw new Error(error.message);
    const old = [];
    if (uploaded.logo && me.logo_path) old.push(me.logo_path);
    if (uploaded.photo && me.photo_path) old.push(me.photo_path);
    if (old.length) await sb.storage.from('media').remove(old);
    state.pf = {};
    await reloadMe(); render(); toast('Profile saved.');
  } catch (error) {
    const left = Object.values(uploaded); if (left.length) await sb.storage.from('media').remove(left);
    err.textContent = error.message || 'Could not save. Try again.';
    btn.disabled = false;
  }
}

// Back: closes whatever is open, then steps back through the sections, then opens the shops page
function dashBack() {
  if (state.sheet) { closeSheet(); return; }
  if (state.role === 'admin') {
    if (state.thread) { state.thread = null; render(); return; }
    if (state.tab !== 'sellers') { state.tab = 'sellers'; render(); window.scrollTo(0, 0); return; }
  } else {
    if (state.salesView === 'report') { state.salesView = 'overview'; render(); window.scrollTo(0, 0); return; }
    if (state.tab !== 'shop') { state.tab = 'shop'; render(); window.scrollTo(0, 0); return; }
  }
  location.href = 'shops.html';
}
sb.auth.onAuthStateChange((event) => { if (event === 'SIGNED_OUT') location.replace('index.html'); });

// check for new messages every 15 seconds while a conversation is open
setInterval(async () => {
  if (state.tab !== 'messages' || !$('thread') || document.hidden) return;
  try {
    const before = state.messages.length;
    await loadMessages();
    if (state.messages.length !== before) {
      const keep = document.querySelector('.chat-input'), text = keep ? keep.value : '';
      render();
      const again = document.querySelector('.chat-input'); if (again) again.value = text;
    }
  } catch (err) { /* try again next time */ }
}, 15000);


/* ---------- owner footer: site link to copy and share ---------- */
(function () {
  const url = location.origin + location.pathname.replace(/[^/]*$/, '');
  const text = document.getElementById('sitelink'); if (!text) return;
  text.textContent = url.replace(/^https?:\/\//, '').replace(/\/$/, '');
  document.getElementById('sharesite').href = 'https://wa.me/?text=' + encodeURIComponent('Visit ShopLink: ' + url);
  // owner photo and name come from the admin's profile
  try {
    if (typeof sb !== 'undefined' && sb) {
      sb.from('site_owner').select('full_name,photo_path').limit(1).then(({ data }) => {
        const o = data && data[0]; if (!o) return;
        if (o.full_name) document.getElementById('owner-name').textContent = o.full_name;
        if (o.photo_path) {
          const img = document.createElement('img'); img.className = 'owner-photo'; img.alt = '';
          img.src = sb.storage.from('media').getPublicUrl(o.photo_path).data.publicUrl;
          document.getElementById('owner-photo').appendChild(img);
        }
      });
    }
  } catch (e) { /* the footer still shows the default name */ }
  const btn = document.getElementById('copysite');
  btn.addEventListener('click', () => {
    const done = () => { btn.textContent = 'Copied!'; setTimeout(() => { btn.textContent = 'Copy link'; }, 2000); };
    if (navigator.clipboard) navigator.clipboard.writeText(url).then(done, () => window.prompt('Copy this link:', url));
    else window.prompt('Copy this link:', url);
  });
})();

/* ---------- start ---------- */
(async function boot() {
  try {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { try { if (state.highlight) sessionStorage.setItem('shoplink-item', state.highlight); } catch (e) { /* ignore */ } location.replace('index.html'); return; }
    try { sessionStorage.removeItem('shoplink-item'); } catch (e) { /* ignore */ }
    const { data: me, error } = await sb.from('profiles').select('*').eq('id', session.user.id).single();
    if (error || !me) throw new Error('Could not load your profile. ' + (error ? error.message : ''));
    state.me = me;
    state.role = me.role === 'admin' ? 'admin' : 'seller';
    state.tab = state.role === 'admin' ? 'sellers' : 'shop';
    $('who').textContent = state.role === 'admin' ? 'Admin' : 'Seller';
    if (state.role === 'admin') await loadAdmin(); else await loadSeller();
    render();
  } catch (err) {
    $('app').innerHTML = `<main class="wrap"><p class="err">${esc(err.message || err)}</p><button class="btn" onclick="location.reload()">Try again</button></main>`;
  }
})();
</script>
