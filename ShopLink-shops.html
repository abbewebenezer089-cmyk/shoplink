.promo-public{margin:.8rem 0 1rem}.promo-public h3{font-size:1rem;margin:0 0 .45rem}.promo-public-row{display:flex;gap:.7rem;overflow-x:auto;padding:.15rem 0 .5rem}.promo-public-card{flex:0 0 min(72vw,300px);max-width:300px}.promo-public-card video{display:block;width:100%;max-height:280px;object-fit:contain;background:#111;border-radius:.8rem}
/* Jumia-inspired mixed marketplace: varied card heights, compact images */

.shoplink-picks{position:fixed;z-index:9999;left:50%;bottom:max(.45rem,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(calc(100% - 1rem),22rem);min-height:3.35rem;display:flex;align-items:center;gap:.45rem;padding:.36rem .48rem;background:rgba(255,255,255,.98);border:1px solid #d9dcea;border-radius:.75rem;box-shadow:0 4px 18px rgba(30,35,71,.2);backdrop-filter:blur(10px);transition:opacity .25s,transform .25s}

<body>
<div id="splash" class="splash" role="status" aria-label="ShopLink">
  <img src="logo.svg" alt="">
  <h1>ShopLink</h1>
  <p>Connecting sellers and buyers worldwide.</p>
  <p class="sl2">One link 🖇️ at a time</p>
</div>
<script>
(function () {
  var s = document.getElementById('splash');
  try {
    if (sessionStorage.getItem('shoplink-splash')) { s.remove(); return; }
    sessionStorage.setItem('shoplink-splash', '1');
  } catch (e) { /* show it anyway */ }
  setTimeout(function () { s.style.opacity = '0'; setTimeout(function () { s.remove(); }, 400); }, 2000);
})();
</script>
<header class="bar">
  <div class="wrap">
    <img src="logo.svg" alt="">

  </div>
</header>

  <ul id="sugg" class="sugg" hidden></ul>
</div>
<div id="app"><p class="empty">Loading shops...</p></div>

</footer>
<div id="overlay"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const cfg = window.SHOPLINK_CONFIG || {};
const sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DEFAULT_CUR = cfg.CURRENCY || '';
const CC = cfg.COUNTRY_CODE || '';
const curOf = (s) => (s && s.currency) || DEFAULT_CUR;
const money = (n, cur) => (n == null || n === '') ? '' : (cur ? cur + ' ' : '') + Number(n).toLocaleString('en-US');
const mediaUrl = (p) => sb.storage.from('media').getPublicUrl(p).data.publicUrl;
const initial = (t) => (String(t || '').trim()[0] || '?').toUpperCase();
// numbers saved with a country are already complete; older ones may need the country code added
function waNumber(raw, country) {
  let d = String(raw || '').replace(/\D/g, '');
  if (country) return d;
  if (d.startsWith('00')) d = d.slice(2); else if (d.startsWith('0') && CC) d = CC + d.slice(1);
  return d;
}
const sortMedia = (i) => (i.item_media || []).slice().sort((a, b) => a.created_at < b.created_at ? -1 : a.created_at > b.created_at ? 1 : 0);
const shopUrl = (s) => location.origin + location.pathname.replace(/[^/]*$/, '') + 'shops.html?shop=' + encodeURIComponent(s.shop_slug);
const logoHtml = (s, size) => s.logo_path ? `<img class="logo ${size}" src="${esc(mediaUrl(s.logo_path))}" alt="">` : `<span class="logo ${size}">${esc(initial(s.shop_name))}</span>`;
const photoHtml = (s, size) => s.photo_path ? `<img class="photo ${size}" src="${esc(mediaUrl(s.photo_path))}" alt="">` : `<span class="photo ${size}">${esc(initial(s.owner_name))}</span>`;

const only = new URLSearchParams(location.search).get('shop');

// anonymous counting: a random code kept on this phone, never a name or number
function visitorId() {
  try {
    let v = localStorage.getItem('shoplink-visitor');
    if (!v) { v = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2); localStorage.setItem('shoplink-visitor', v); }
    return v;
  } catch (e) { return 'unknown'; }
}
function logEvent(kind, sellerId, itemId) {
  try { sb.rpc('log_event', {p_seller: sellerId, p_item: itemId || null, p_kind: kind, p_visitor: visitorId()}).then(() => {}, () => {}); } catch (e) { /* counting must never break the page */ }
}
const state = {shops:[], cats:[], items:[], promoVideos:[], cat:'all', sheet:null, q:'', qRaw:'', highlight:new URLSearchParams(location.search).get('item'), meId:null, scrolled:false};

async function ok(promise) {
  const { data, error } = await promise;
  if (error) throw new Error(error.message);
  return data || [];
}


/* ---------- search by town ---------- */
const norm = (t) => String(t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9\s]/g, ' ').replace(/\s+/g, ' ').trim();
function itemMatches(i, s, q) {
  if (!q) return true;
  const cat = state.cats.find((c) => c.id === i.category_id);
  const hay = norm([s.location, s.landmark, s.shop_name, s.owner_name, i.title, i.note, cat ? cat.name : ''].join(' '));
  return q.split(' ').every((w) => hay.includes(w));
}
// every town written in sellers' locations, with how many shops are there
function places() {
  const map = new Map();
  state.shops.forEach((s) => {
    const seen = new Set();
    String(s.location || '').split(',').forEach((part) => {
      const name = part.trim(), key = norm(name);
      if (!key || seen.has(key)) return;
      seen.add(key);
      const e = map.get(key) || {name, count: 0};
      e.count++; map.set(key, e);
    });
  });
  return Array.from(map.values()).sort((a, b) => b.count - a.count || a.name.localeCompare(b.name));
}
function products() {
  const map = new Map();
  state.items.forEach((i) => { const key = norm(i.title); if (!key) return; const e = map.get(key) || {name: i.title, count: 0}; e.count++; map.set(key, e); });
  return Array.from(map.values()).sort((a, b) => b.count - a.count || a.name.localeCompare(b.name));
}
function drawSugg() {
  const box = $('sugg'), q = norm($('q').value);
  let towns = places(), things = products(), shops = [];
  if (q) {
    const words = q.split(' ');
    const withItems = new Set(state.items.map((i) => i.seller_id));
    shops = state.shops.filter((s) => withItems.has(s.id) && words.every((w) => norm(s.shop_name + ' ' + s.owner_name).includes(w)));
    towns = towns.filter((p) => norm(p.name).includes(q));
    things = things.filter((p) => norm(p.name).includes(q));
  }
  shops = shops.slice(0, 4); towns = towns.slice(0, q ? 4 : 3); things = things.slice(0, q ? 4 : 3);
  if (!shops.length && !towns.length && !things.length) { box.hidden = true; return; }
  const row = (name, note) => `<li><button type="button" data-act="place" data-v="${esc(name)}">${esc(name)} <small>${esc(note)}</small></button></li>`;
  box.innerHTML =
    (shops.length ? '<li class="hd">Shops</li>' + shops.map((s) => row(s.shop_name, s.location || 'Shop')).join('') : '') +
    (towns.length ? '<li class="hd">Towns</li>' + towns.map((p) => row(p.name, p.count + ' shop' + (p.count === 1 ? '' : 's'))).join('') : '') +
    (things.length ? '<li class="hd">Products</li>' + things.map((p) => row(p.name, p.count + ' item' + (p.count === 1 ? '' : 's'))).join('') : '');
  box.hidden = false;
}
function setQuery(text) {
  $('q').value = text;
  state.qRaw = text; state.q = norm(text);
  $('sugg').hidden = true;
  render();
}

function orderLink(i, s) {
  // This link opens the seller's private dashboard on the exact product.
  // Supabase RLS ensures only the signed-in owner can see/manage that product.
  const base = location.origin + location.pathname.replace(/[^/]*$/, '');
  const productLink = base + 'dashboard.html?item=' + encodeURIComponent(i.id);
  const msg = `Hi, I'd like to order the ${i.title}${i.price != null ? ' (' + money(i.discount_price != null && Number(i.discount_price)>0 && Number(i.discount_price)<Number(i.price) ? i.discount_price : i.price, curOf(s)) + ')' : ''} from ${s.shop_name} on ShopLink.\nProduct link: ${productLink}`;
  return 'https://wa.me/' + waNumber(s.whatsapp, s.country) + '?text=' + encodeURIComponent(msg);
}

function card(i, s, variant = 0, showSeller = false) {
  const media = sortMedia(i), first = media.find((m) => m.kind === 'image') || media[0], sold = i.status === 'sold';
  return `<article class="card h${state.highlight === i.id ? ' hl' : ''}${showSeller ? ' market-card mosaic-' + (variant % 6) : ''}" id="item-${i.id}" data-act="item" data-v="${i.id}">
    <div class="tile-wrap">${i.discount_price != null && Number(i.discount_price)>0 && Number(i.discount_price)<Number(i.price) ? `<span style="position:absolute;z-index:3;top:8px;left:8px;background:#e53935;color:#fff;border-radius:7px;padding:4px 6px;font-size:10px;font-weight:900">-${Math.round((Number(i.price)-Number(i.discount_price))/Number(i.price)*100)}%</span>` : ''}${state.highlight === i.id ? '<span class="hl-badge">Selected</span>' : ''}${first ? `<img src="${esc(mediaUrl(first.path))}" alt="${esc(i.title)}" loading="lazy">` : ''}${media.length > 1 ? `<span class="count">+${media.length - 1}</span>` : ''}${sold ? '<span class="stamp">Sold</span>' : ''}</div>
    <h3>${esc(i.title)}</h3>${showSeller ? `<p class="market-seller">${esc(s.shop_name || 'ShopLink seller')}</p>` : ''}${i.discount_price != null && Number(i.discount_price)>0 && Number(i.discount_price)<Number(i.price) ? `<p class="price"><span style="color:#d8322f">${esc(money(i.discount_price,curOf(s)))}</span> <small style="text-decoration:line-through;color:#888">${esc(money(i.price,curOf(s)))}</small> <b style="color:#d8322f;font-size:.72rem">-${Math.round((Number(i.price)-Number(i.discount_price))/Number(i.price)*100)}%</b></p>` : (i.price != null ? `<p class="price">${esc(money(i.price, curOf(s)))}</p>` : '')}
    ${i.note ? `<span class="note">${esc(i.note)}</span>` : '<div class="gap"></div>'}
    ${sold ? '<span class="btn off">Sold out</span>' : `<a class="btn" data-enq="${i.id}" data-shop="${s.id}" target="_blank" rel="noopener" href="${esc(orderLink(i, s))}">Order on WhatsApp</a>`}
  </article>`;
}

function render() {
  const byShop = {};
  state.items.forEach((i) => { (byShop[i.seller_id] || (byShop[i.seller_id] = [])).push(i); });
  const videosByShop = {};
  state.promoVideos.forEach((v) => { (videosByShop[v.seller_id] || (videosByShop[v.seller_id] = [])).push(v); });
  let shops = state.shops.slice();
  if (only) shops = shops.filter((s) => s.shop_slug === only);

  // newest activity first
  const newest = (s) => (byShop[s.id] && byShop[s.id][0]) ? byShop[s.id][0].created_at : ((videosByShop[s.id] && videosByShop[s.id][0]) ? videosByShop[s.id][0].created_at : '');
  shops.sort((a, b) => newest(a) < newest(b) ? 1 : -1);

  const chips = [['all', 'All']].concat(state.cats.map((c) => [c.id, c.name])).map(([id, name]) =>
    `<button class="chip" aria-pressed="${state.cat === id}" data-act="cat" data-v="${id}">${esc(name)}</button>`).join('');

  let banner = '';
  if (state.highlight) {
    const hi = state.items.find((x) => x.id === state.highlight);
    banner = hi
      ? `<div class="hlbar"><b>⭐ ${esc(hi.title)}</b> is the item you selected.${state.meId && state.meId === hi.seller_id ? ` <a href="dashboard.html?item=${esc(hi.id)}">Open it in my dashboard</a>` : ''}</div>`
      : '<div class="hlbar gone">This item is no longer available. It may have been sold.</div>';
  }
  const rows = shops.map((s) => {
    const list = (byShop[s.id] || []).filter((i) => (state.cat === 'all' || i.category_id === state.cat) && (only || itemMatches(i, s, state.q)));
    const promo = videosByShop[s.id] || [];
    if (!list.length && !promo.length && !only) return '';
    return `<section class="shop"><div class="shop-head"><div class="who"><button class="avatar" data-act="info" data-v="${s.id}" aria-label="See who runs ${esc(s.shop_name)}">${photoHtml(s, 'hero')}${logoHtml(s, 'badge')}</button><div><h2>${esc(s.shop_name)}</h2><p class="muted">${esc(s.shop_type)}, ${list.length} item${list.length === 1 ? '' : 's'}</p>${s.location ? `<p class="muted">📍 ${esc(s.location)}</p>` : ''}<span class="owner">${esc(s.owner_name)}</span></div></div>
      <div class="hbtns"><button class="pillbtn" data-act="info" data-v="${s.id}" aria-label="Shop info for ${esc(s.shop_name)}">Info</button><a class="pillbtn wa" data-enq="" data-shop="${s.id}" target="_blank" rel="noopener" href="https://wa.me/${waNumber(s.whatsapp, s.country)}" aria-label="Chat with ${esc(s.shop_name)} on WhatsApp">Chat</a></div></div>
      ${promo.length ? `<div class="promo-public"><h3>From this seller</h3><div class="promo-public-row">${promo.map((v) => `<div class="promo-public-card"><video src="${esc(mediaUrl(v.path))}" controls playsinline preload="metadata"></video></div>`).join('')}</div></div>` : ''}
      ${list.length ? `<section class="market-grid shop-grid" aria-label="Items from ${esc(s.shop_name)}">${list.map((i) => card(i, s, 0, true)).join('')}</section>` : '<p class="muted">No items in this category yet.</p>'}</section>`;
  }).join('');

  let body;
  if (only && !shops.length) body = '<p class="empty">This shop is not available right now.</p><p style="text-align:center"><a href="index.html"><b>Go to the home page</b></a></p>';
  else if (!only) {
    const shopMap = new Map(state.shops.map((shop) => [shop.id, shop]));
    let feed = state.items.filter((i) => (state.cat === 'all' || i.category_id === state.cat) && (!state.q || itemMatches(i, shopMap.get(i.seller_id) || {}, state.q)));
    /* Randomise products on each fresh page load, while avoiding long runs from one seller. */
    const buckets = new Map();
    const shuffle = (arr) => { for (let n = arr.length - 1; n > 0; n--) { const j = Math.floor(Math.random() * (n + 1)); [arr[n], arr[j]] = [arr[j], arr[n]]; } return arr; };
    feed.forEach((item) => { const key = item.seller_id; if (!buckets.has(key)) buckets.set(key, []); buckets.get(key).push(item); });
    const sellerBuckets = shuffle(Array.from(buckets.values()).map((bucket) => shuffle(bucket)));
    const mixed = []; let lastSeller = null;
    while (sellerBuckets.some((bucket) => bucket.length)) {
      const available = sellerBuckets.filter((bucket) => bucket.length);
      let choices = available.filter((bucket) => bucket[0].seller_id !== lastSeller);
      if (!choices.length) choices = available;
      const chosen = choices[Math.floor(Math.random() * choices.length)];
      const next = chosen.shift(); mixed.push(next); lastSeller = next.seller_id;
    }
    body = mixed.length ? `<section class="market-grid" aria-label="Randomly mixed products from ShopLink sellers">${mixed.map((item, index) => { const seller = shopMap.get(item.seller_id); return seller ? card(item, seller, Math.floor(Math.random() * 6), true) : ''; }).join('')}</section>` : (rows || '<p class="empty">No items in this category yet.</p>');
  }
  else if (rows) body = rows;
  else if (state.q) body = `<p class="empty">Nothing found for “${esc(state.qRaw)}” yet.</p><div class="placechips">${places().slice(0, 6).map((p) => `<button class="chip" data-act="place" data-v="${esc(p.name)}">${esc(p.name)}</button>`).join('')}</div>`;
  else body = '<p class="empty">No items in this category yet.</p>';
  $('app').innerHTML = `<main class="wrap"><p class="lead">${only ? '' : 'Discover products from different ShopLink sellers.'}</p>${banner}<div class="chips">${chips}</div>${(!only && state.q && rows) ? `<div class="found"><p>Results for “${esc(state.qRaw)}”</p><button class="linkbtn" data-act="clearq">Clear</button></div>` : ''}${body}</main>`;
  $('overlay').innerHTML = sheet();
  if (state.highlight && !state.scrolled) {
    const el = $('item-' + state.highlight);
    if (el && el.scrollIntoView) { state.scrolled = true; setTimeout(() => el.scrollIntoView({behavior: 'smooth', block: 'center', inline: 'center'}), 300); }
  }
}

function sheet() {
  const sh = state.sheet; if (!sh) return '';
  if (sh.type === 'info') {
    const s = state.shops.find((x) => x.id === sh.id);
    return `<div class="scrim" data-act="close"><div class="sheet" role="dialog" aria-modal="true" aria-label="Shop info"><div class="sheet-head"><h2>Shop info</h2><button class="x" data-act="close" aria-label="Close">×</button></div>
    <div class="hero-id">${photoHtml(s, 'xl')}<h3>${esc(s.owner_name)}</h3><p class="muted">Shop owner</p></div>
    <div class="idcard">${logoHtml(s, 'lg')}<div><h3>${esc(s.shop_name)}</h3><p class="muted">${esc(s.shop_type)}</p></div></div>
    <dl class="info"><dt>WhatsApp</dt><dd>+${esc(waNumber(s.whatsapp, s.country))}</dd>
      ${s.email ? `<dt>Email</dt><dd><a href="mailto:${esc(s.email)}">${esc(s.email)}</a></dd>` : ''}
      ${s.location ? `<dt>Location</dt><dd>${esc(s.location)}</dd>` : ''}
      ${s.landmark ? `<dt>Nearest landmark</dt><dd>${esc(s.landmark)}</dd>` : ''}</dl>
    <a class="btn lg" data-enq="" data-shop="${s.id}" target="_blank" rel="noopener" href="https://wa.me/${waNumber(s.whatsapp, s.country)}">Chat on WhatsApp</a></div></div>`;
  }
  if (sh.type === 'item') {
    const i = state.items.find((x) => x.id === sh.id), s = state.shops.find((x) => x.id === i.seller_id), media = sortMedia(i), sold = i.status === 'sold';
    const cat = state.cats.find((c) => c.id === i.category_id);
    const pics = media.map((m, k) => `<div class="pic">${m.kind === 'video'
      ? `<video src="${esc(mediaUrl(m.path))}" controls playsinline preload="metadata"></video>`
      : `<img src="${esc(mediaUrl(m.path))}" alt="${esc(i.title)}">`}<span class="count">${k + 1} of ${media.length}</span>${sold ? '<span class="stamp">Sold</span>' : ''}</div>`).join('');
    return `<div class="scrim" data-act="close"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(i.title)}"><div class="sheet-head"><div class="seller-strip">${photoHtml(s, 'sm')}<div><b>${esc(s.shop_name)}</b><span class="muted">${esc(s.owner_name)}</span></div></div><button class="x" data-act="close" aria-label="Close">×</button></div>
    <div class="pics">${pics}</div>
    <h3 class="t">${esc(i.title)}</h3><p class="muted">${esc(cat ? cat.name : '')}</p>
    ${i.discount_price != null && Number(i.discount_price)>0 && Number(i.discount_price)<Number(i.price) ? `<p class="price" style="font-size:1.2rem;margin-top:.3rem"><span style="color:#d8322f">${esc(money(i.discount_price,curOf(s)))}</span> <small style="text-decoration:line-through;color:#888">${esc(money(i.price,curOf(s)))}</small> <b style="color:#d8322f;font-size:.72rem">-${Math.round((Number(i.price)-Number(i.discount_price))/Number(i.price)*100)}%</b></p>` : (i.price != null ? `<p class="price" style="font-size:1.2rem;margin-top:.3rem">${esc(money(i.price, curOf(s)))}</p>` : '')}${i.note ? `<span class="note">${esc(i.note)}</span>` : ''}
    <div style="margin-top:.9rem">${sold ? '<span class="btn off lg">Sold out</span>' : `<a class="btn lg" data-enq="${i.id}" data-shop="${s.id}" target="_blank" rel="noopener" href="${esc(orderLink(i, s))}">Order on WhatsApp</a>`}</div></div></div>`;
  }
  return '';
}

document.addEventListener('click', (e) => {
  const link = e.target.closest('a[data-shop]');
  if (link) logEvent('enquiry', link.dataset.shop, link.dataset.enq);
  if (e.target.closest('a[href]')) return;
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (el.classList.contains('scrim') && e.target !== el) return;
  const act = el.dataset.act, v = el.dataset.v;
  if (act === 'picks-close') { $('shoplink-picks').hidden = true; return; }
  if (act === 'scroll-row') {
    const shop = el.closest('.shop');
    const row = shop && shop.querySelector('.row');
    if (row) row.scrollBy({left: Number(el.dataset.dir || 1) * Math.max(260, row.clientWidth * 0.8), behavior: 'smooth'});
    return;
  }
  if (act === 'cat') { state.cat = v; render(); }
  else if (act === 'place') { setQuery(v); }
  else if (act === 'clearq') { setQuery(''); }
  else if (act === 'info') { state.sheet = {type: 'info', id: v}; render(); }
  else if (act === 'item') { state.sheet = {type: 'item', id: v}; render(); const it = state.items.find((x) => x.id === v); if (it) logEvent('item_view', it.seller_id, it.id); }
  else if (act === 'close') { state.sheet = null; render(); }
});


/* ---------- owner footer: site link to copy and share ---------- */
(function () {
  const url = location.origin + location.pathname.replace(/[^/]*$/, '');
  const text = document.getElementById('sitelink'); if (!text) return;
  text.textContent = url.replace(/^https?:\/\//, '').replace(/\/$/, '');
  document.getElementById('sharesite').href = 'https://wa.me/?text=' + encodeURIComponent('Visit ShopLink: ' + url);
  // owner photo and name come from the admin's profile
  try {
    if (typeof sb !== 'undefined' && sb) {
      sb.from('site_owner').select('full_name,photo_path').limit(1).then(({ data }) => {
        const o = data && data[0]; if (!o) return;
        if (o.full_name) document.getElementById('owner-name').textContent = o.full_name;
        if (o.photo_path) {
          const img = document.createElement('img'); img.className = 'owner-photo'; img.alt = '';
          img.src = sb.storage.from('media').getPublicUrl(o.photo_path).data.publicUrl;
          document.getElementById('owner-photo').appendChild(img);
        }
      });
    }
  } catch (e) { /* the footer still shows the default name */ }
  const btn = document.getElementById('copysite');
  btn.addEventListener('click', () => {
    const done = () => { btn.textContent = 'Copied!'; setTimeout(() => { btn.textContent = 'Copy link'; }, 2000); };
    if (navigator.clipboard) navigator.clipboard.writeText(url).then(done, () => window.prompt('Copy this link:', url));
    else window.prompt('Copy this link:', url);
  });
})();

function goBack(fallback) {
  try { if (history.length > 1 && document.referrer && new URL(document.referrer).origin === location.origin) { history.back(); return; } } catch (e) { /* use the fallback */ }
  location.href = fallback;
}
$('backbtn').addEventListener('click', (e) => {
  e.preventDefault();
  if (state.sheet) { state.sheet = null; render(); return; }
  if (state.q) { setQuery(''); return; }
  goBack('index.html');
});
$('q').addEventListener('input', (e) => { state.qRaw = e.target.value; state.q = norm(e.target.value); drawSugg(); render(); });
$('q').addEventListener('search', (e) => { state.qRaw = e.target.value; state.q = norm(e.target.value); drawSugg(); render(); });
$('q').addEventListener('focus', drawSugg);
$('q').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); $('sugg').hidden = true; $('q').blur(); } });
document.addEventListener('click', (e) => { if (!e.target.closest('#searchbox')) $('sugg').hidden = true; });
if (only) $('searchbox').hidden = true;

let picksTimer = null, picksIndex = 0, picksOrder = [];
function showShopLinkPick() {
  const panel = $('shoplink-picks');
  if (!panel || only) { if (panel) panel.hidden = true; return; }
  const available = state.items.filter((i) => String(i.status || '').toLowerCase() !== 'sold');
  if (!available.length) { panel.hidden = true; return; }
  if (!picksOrder.length || picksOrder.length !== available.length || picksIndex >= picksOrder.length) {
    picksOrder = available.slice();
    for (let n = picksOrder.length - 1; n > 0; n--) { const j = Math.floor(Math.random() * (n + 1)); [picksOrder[n], picksOrder[j]] = [picksOrder[j], picksOrder[n]]; }
    picksIndex = 0;
  }
  const item = picksOrder[picksIndex++];
  const seller = state.shops.find((sh) => sh.id === item.seller_id) || null;
  const media = sortMedia(item), first = media.find((m) => m.kind === 'image');
  $('picks-image').src = first ? mediaUrl(first.path) : 'logo.svg';
  $('picks-image').alt = item.title || 'ShopLink product';
  $('picks-title').textContent = item.title || 'Discover this product';
  $('picks-price').textContent = item.price != null ? money(item.price, seller ? curOf(seller) : 'GHS') : (seller ? seller.shop_name : 'View product');
  $('picks-item').dataset.v = item.id;
  const button = $('picks-item'); button.classList.remove('swap'); void button.offsetWidth; button.classList.add('swap');
  panel.hidden = false;
  panel.style.display = 'flex';
  panel.style.visibility = 'visible';
  panel.style.opacity = '1';
}
(async function boot() {
  try {
    const [shops, cats, items, promoVideos] = await Promise.all([
      ok(sb.from('shops').select('*')),
      ok(sb.from('categories').select('*').order('sort')),
      ok(sb.from('items').select('id,seller_id,title,price,discount_price,note,status,category_id,created_at,item_media(id,kind,path,created_at)').order('created_at', {ascending: false})),
      ok(sb.from('seller_videos').select('id,seller_id,path,created_at').order('created_at', {ascending: false}))
    ]);
    state.shops = shops; state.cats = cats; state.items = items; state.promoVideos = promoVideos;
    if (only) { const sh = shops.find((x) => x.shop_slug === only); if (sh) logEvent('shop_visit', sh.id, null); }
    try { const { data: { session } } = await sb.auth.getSession(); state.meId = session ? session.user.id : null; } catch (e) { /* not signed in */ }
    render();
    if (!only && state.items.length) {
      if (picksTimer) clearInterval(picksTimer);
      // Show the first pick after the intro splash has cleared, then rotate every 8 seconds.
      setTimeout(() => { showShopLinkPick(); }, 2600);
      picksTimer = setInterval(showShopLinkPick, 8000);
    }
  } catch (err) {
    $('app').innerHTML = `<main class="wrap"><p class="err">${esc(err.message || err)}</p><button class="btn" onclick="location.reload()">Try again</button></main>`;
  }
})();
</script>
